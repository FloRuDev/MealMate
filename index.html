    // ============================================================================
    // REINE DOMÄNEN- & HILFSFUNKTIONEN (CLEAN CODE)
    // ============================================================================
    const getRandomSubset = (array, size = APP_CONFIG.INITIAL_DECK_SIZE, rng = Math.random) => {
      if (!Array.isArray(array) || array.length === 0 || size <= 0) return [];
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, Math.min(size, copy.length));
    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const getDayPortions = (item) => {
      if (!item) return {};
      if (item.dayPortions && typeof item.dayPortions === 'object') {
        return item.dayPortions;
      }
      if (item.weekday) {
        return { [item.weekday]: item.portions || APP_CONFIG.DEFAULT_BASE_PORTIONS };
      }
      return {};
    };

    const getTotalPortions = (item) => {
      if (!item) return APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const dp = getDayPortions(item);
      const days = Object.keys(dp);
      if (days.length > 0) {
        return days.reduce((sum, day) => sum + (Number(dp[day]) || 0), 0);
      }
      return item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
    };

    const formatDaySchedule = (item) => {
      const dp = getDayPortions(item);
      return WEEKDAYS.filter((d) => (dp[d.short] || 0) > 0)
        .map((d) => `${d.short}: ${dp[d.short]}P`)
        .join(', ');
    };

    const applyWeekdayToggle = (item, dayShort, defaultPortions = APP_CONFIG.DEFAULT_DAY_PORTIONS) => {
      const currentDp = { ...getDayPortions(item) };
      if (currentDp[dayShort]) {
        delete currentDp[dayShort];
      } else {
        currentDp[dayShort] = defaultPortions;
      }
      const remainingDays = WEEKDAYS.map((d) => d.short).filter((d) => currentDp[d] > 0);
      const nextTotal =
        remainingDays.length > 0
          ? remainingDays.reduce((sum, d) => sum + currentDp[d], 0)
          : item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;

      return {
        ...item,
        dayPortions: currentDp,
        weekday: remainingDays[0] || null,
        portions: nextTotal
      };
    };

    const applyDayPortionDelta = (item, dayShort, delta) => {
      const currentDp = { ...getDayPortions(item) };
      const currentVal = currentDp[dayShort] || APP_CONFIG.DEFAULT_DAY_PORTIONS;
      currentDp[dayShort] = clamp(currentVal + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_DAY_PORTIONS);
      const nextTotal = Object.values(currentDp).reduce((sum, v) => sum + v, 0);

      return {
        ...item,
        dayPortions: currentDp,
        portions: nextTotal
      };
    };

    const CATEGORY_ORDER = [
      { key: 'Obst & Gemüse', icon: '🥦', badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' },
      { key: 'Fleisch & Frische', icon: '🍗', badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30' },
      { key: 'Kühlregal', icon: '🥛', badge: 'bg-sky-500/15 text-sky-300 border-sky-500/30' },
      { key: 'Tiefkühlung', icon: '❄️', badge: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
      { key: 'Vorratsschrank', icon: '🥫', badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30' }
    ];

    const aggregateShoppingList = (activeShoppingRecipes) => {
      const map = {};
      const validCategories = new Set(CATEGORY_ORDER.map((c) => c.key));

      (activeShoppingRecipes || []).forEach((item) => {
        const { recipe } = item;
        if (!recipe || !Array.isArray(recipe.ingredients)) return;

        const totalPortions = getTotalPortions(item);
        const scheduleLabel = formatDaySchedule(item);
        const basePortions = recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
        const scale = totalPortions / basePortions;

        recipe.ingredients.forEach((ing) => {
          const normCategory = validCategories.has(ing.category) ? ing.category : 'Vorratsschrank';
          const key = `${normCategory}__${ing.name.toLowerCase().trim()}__${ing.unit.toLowerCase().trim()}`;

          if (!map[key]) {
            map[key] = {
              id: key,
              name: ing.name,
              unit: ing.unit,
              category: normCategory,
              amount: 0,
              sources: []
            };
          }

          map[key].amount += ing.amount * scale;
          const sourceLabel = scheduleLabel
            ? `${recipe.title} (${scheduleLabel})`
            : `${recipe.title} (${totalPortions}P)`;

          if (!map[key].sources.includes(sourceLabel)) {
            map[key].sources.push(sourceLabel);
          }
        });
      });

      const grouped = {};
      CATEGORY_ORDER.forEach((cat) => {
        grouped[cat.key] = [];
      });

      Object.values(map).forEach((entry) => {
        const roundedAmount =
          entry.amount >= 10 ? Math.round(entry.amount) : Math.round(entry.amount * 10) / 10;
        grouped[entry.category].push({ ...entry, amount: roundedAmount });
      });

      return grouped;
    };

    const calculatePlanStats = (activeShoppingRecipes, savedRecipes) => {
      const targetList =
        activeShoppingRecipes && activeShoppingRecipes.length > 0
          ? activeShoppingRecipes
          : savedRecipes || [];

      if (targetList.length === 0) {
        return { totalPortions: 0, avgCalories: 0, avgProtein: 0 };
      }

      let totalPortions = 0;
      let weightedCal = 0;
      let weightedProt = 0;

      targetList.forEach((item) => {
        const portions = getTotalPortions(item);
        totalPortions += portions;
        weightedCal += (item.recipe?.calories || 0) * portions;
        weightedProt += (item.recipe?.protein || 0) * portions;
      });

      return {
        totalPortions,
        avgCalories: totalPortions > 0 ? Math.round(weightedCal / totalPortions) : 0,
        avgProtein: totalPortions > 0 ? Math.round(weightedProt / totalPortions) : 0
      };
    };

    const formatShoppingListText = (
      activeShoppingRecipes = [],
      aggregatedShoppingList = {},
      checkedItems = {}
    ) => {
      const lines = ['🛒 MEALMATE EINKAUFSLISTE', ''];

      if (activeShoppingRecipes.length > 0) {
        lines.push('Geplante Gerichte:');
        activeShoppingRecipes.forEach((item) => {
          const schedule = formatDaySchedule(item);
          const totalP = getTotalPortions(item);
          lines.push(
            `- ${item.recipe?.title}: ${totalP} Portionen${schedule ? ` (${schedule})` : ''}`
          );
        });
        lines.push('');
      }

      CATEGORY_ORDER.forEach(({ key, icon }) => {
        const items = aggregatedShoppingList[key] || [];
        if (items.length === 0) return;
        lines.push(`${icon} ${key.toUpperCase()}`);
        items.forEach((item) => {
          const checkMark = checkedItems[item.id] ? '[x]' : '[ ]';
          lines.push(`${checkMark} ${item.amount} ${item.unit} ${item.name}`);
        });
        lines.push('');
      });

      return lines.join('\n').trim();
    };

    const ACCENT_GRADIENTS = [
      'from-emerald-600 to-teal-700',
      'from-amber-500 to-orange-600',
      'from-rose-500 to-orange-600',
      'from-cyan-600 to-blue-700',
      'from-indigo-600 to-purple-700',
      'from-teal-500 to-emerald-700'
    ];

    const collectKnownRecipeTitles = (deck = [], savedRecipes = [], database = []) => {
      const titles = new Set();
      (database || []).forEach((r) => {
        if (r?.title) titles.add(r.title.trim());
      });
      (deck || []).forEach((r) => {
        if (r?.title) titles.add(r.title.trim());
      });
      (savedRecipes || []).forEach((item) => {
        if (item?.recipe?.title) titles.add(item.recipe.title.trim());
      });
      return Array.from(titles);
    };

    // ============================================================================
    // ARCHITEKTUR-MODUL 3: Runtime-Schema-Validierung (Zod-inspiriert)
    // ============================================================================
    const VALID_INGREDIENT_CATEGORIES = new Set(CATEGORY_ORDER.map((c) => c.key));

    const coercePositiveNumber = (val, fallback, min = 0, max = 10000) => {
      const num = typeof val === 'number' ? val : Number(String(val ?? '').replace(',', '.'));
      if (!Number.isFinite(num)) return fallback;
      return clamp(num, min, max);
    };

    const coerceNonEmptyString = (val, fallback) => {
      if (typeof val === 'string' && val.trim().length > 0) return val.trim();
      return fallback;
    };

    const validateAndSanitizeIngredient = (rawIng, index = 0) => {
      if (!rawIng || typeof rawIng !== 'object') {
        return {
          name: `Zutat ${index + 1}`,
          amount: 100,
          unit: 'g',
          category: 'Vorratsschrank'
        };
      }
      const rawCategory = coerceNonEmptyString(rawIng.category, 'Vorratsschrank');
      return {
        name: coerceNonEmptyString(rawIng.name, `Zutat ${index + 1}`),
        amount: coercePositiveNumber(rawIng.amount, 100, 0.1, 5000),
        unit: coerceNonEmptyString(rawIng.unit, 'g'),
        category: VALID_INGREDIENT_CATEGORIES.has(rawCategory) ? rawCategory : 'Vorratsschrank'
      };
    };

    const validateAndSanitizeRecipe = (raw, fallbackIdPrefix = 'rec-validated', index = 0) => {
      if (!raw || typeof raw !== 'object') {
        return { valid: false, recipe: null };
      }
      const title = coerceNonEmptyString(raw.title, '');
      if (!title) {
        return { valid: false, recipe: null };
      }
      const rawIngredients = Array.isArray(raw.ingredients) ? raw.ingredients : [];
      const sanitizedIngredients =
        rawIngredients.length > 0
          ? rawIngredients.map((ing, idx) => validateAndSanitizeIngredient(ing, idx))
          : [{ name: 'Hauptzutat nach Wahl', amount: 400, unit: 'g', category: 'Fleisch & Frische' }];

      const rawSteps = Array.isArray(raw.steps)
        ? raw.steps.map((s) => coerceNonEmptyString(s, '')).filter(Boolean)
        : [];
      const sanitizedSteps =
        rawSteps.length > 0
          ? rawSteps
          : ['Zutaten vorbereiten, schonend garen und in Meal-Prep-Dosen portionieren.'];

      const sanitizedRecipe = {
        id: coerceNonEmptyString(raw.id, `${fallbackIdPrefix}-${Date.now()}-${index}`),
        title,
        subtitle: coerceNonEmptyString(
          raw.subtitle,
          'Proteinreiches, familienfreundliches Meal-Prep-Gericht'
        ),
        emoji: coerceNonEmptyString(raw.emoji, '🍲'),
        accentColor: coerceNonEmptyString(
          raw.accentColor,
          ACCENT_GRADIENTS[index % ACCENT_GRADIENTS.length]
        ),
        prepTimeActive: Math.round(coercePositiveNumber(raw.prepTimeActive, 15, 5, 120)),
        prepTimePassive: Math.round(coercePositiveNumber(raw.prepTimePassive, 20, 0, 240)),
        effortLevel: coerceNonEmptyString(raw.effortLevel, 'Gering (Alltagstauglich)'),
        fridgeDays: Math.round(coercePositiveNumber(raw.fridgeDays, 3, 1, 7)),
        freezerMonths: Math.round(coercePositiveNumber(raw.freezerMonths, 2, 0, 12)),
        toddlerNote: coerceNonEmptyString(raw.toddlerNote, 'Mild gewürzt & weiche Textur'),
        calories: Math.round(coercePositiveNumber(raw.calories, 500, 150, 1500)),
        protein: Math.round(coercePositiveNumber(raw.protein, 40, 5, 150)),
        carbs: Math.round(coercePositiveNumber(raw.carbs, 50, 0, 250)),
        fat: Math.round(coercePositiveNumber(raw.fat, 12, 1, 100)),
        basePortions: Math.round(
          coercePositiveNumber(raw.basePortions, APP_CONFIG.DEFAULT_BASE_PORTIONS, 1, 12)
        ),
        ingredients: sanitizedIngredients,
        steps: sanitizedSteps
      };

      return { valid: true, recipe: sanitizedRecipe };
    };

    const enrichAiRecipeBatch = (rawRecipes, existingTitles = [], timestamp = Date.now()) => {
      if (!Array.isArray(rawRecipes)) return [];
      const seen = new Set(existingTitles.map((t) => t.toLowerCase().trim()));
      const result = [];

      rawRecipes.forEach((raw, idx) => {
        const validation = validateAndSanitizeRecipe(raw, `ai-batch-${timestamp}`, idx);
        if (!validation.valid || !validation.recipe) return;

        const normTitle = validation.recipe.title.toLowerCase().trim();
        if (seen.has(normTitle)) return;
        seen.add(normTitle);

        result.push({
          ...validation.recipe,

    // ============================================================================
    // ARCHITEKTUR-MODUL 4: Offline-First (IndexedDB + iOS LocalStorage-Backup)
    // ============================================================================
    const OfflineCacheEngine = (() => {
      const memoryFallback = {};

      const openDb = () =>
        new Promise((resolve, reject) => {
          if (typeof window === 'undefined' || !window.indexedDB) {
            reject(new Error('IndexedDB nicht verfügbar'));
            return;
          }
          const req = window.indexedDB.open(APP_CONFIG.IDB_NAME, APP_CONFIG.IDB_VERSION);
          req.onupgradeneeded = (e) => {
            const idb = e.target.result;
            if (!idb.objectStoreNames.contains('kvStore')) {
              idb.createObjectStore('kvStore');
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });

      const getItem = async (key, defaultVal) => {
        try {
          const idb = await openDb();
          const val = await new Promise((resolve) => {
            const tx = idb.transaction('kvStore', 'readonly');
            const store = tx.objectStore('kvStore');
            const req = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(undefined);
          });
          if (val !== undefined) return val;
        } catch {
          // Fallback auf LocalStorage (wichtig für lokale Datei-Ausführung in iOS Safari)
        }
        try {
          const rawLs = window.localStorage.getItem(`mealmate_${key}`);
          if (rawLs) return JSON.parse(rawLs);
        } catch {
          // Ignorieren
        }
        return memoryFallback[key] ?? defaultVal;
      };

      const setItem = async (key, value) => {
        memoryFallback[key] = value;
        try {
          window.localStorage.setItem(`mealmate_${key}`, JSON.stringify(value));
        } catch {
          // Ignorieren falls Private Mode voll
        }
        try {
          const idb = await openDb();
          await new Promise((resolve) => {
            const tx = idb.transaction('kvStore', 'readwrite');
            const store = tx.objectStore('kvStore');
            store.put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch {
          // Bereits in LocalStorage & Memory gesichert
        }
      };

      return { getItem, setItem };
    })();

    // ============================================================================
    // ARCHITEKTUR-MODUL 2: BFF-Gateway (Caching & Rate-Limiter)
    // ============================================================================
    const MealMateBffGateway = (() => {
      const responseCache = new Map();
      const inFlightRequests = new Map();
      let requestTimestamps = [];
      let stats = { cacheHits: 0, apiCalls: 0, validatedPayloads: 0 };

      const buildCacheKey = (endpoint, payloadSummary) =>
        `${endpoint}::${JSON.stringify(payloadSummary).toLowerCase().trim()}`;

      const getCached = (key, now = Date.now()) => {
        const entry = responseCache.get(key);
        if (!entry) return null;
        if (now - entry.timestamp > APP_CONFIG.BFF_CACHE_TTL_MS) {
          responseCache.delete(key);
          return null;
        }
        stats.cacheHits += 1;
        return entry.data;
      };

      const setCached = (key, data, now = Date.now()) => {
        responseCache.set(key, { data, timestamp: now });
      };

      const executeProxiedRequest = async (cacheKey, fetcherFn) => {
        const cached = getCached(cacheKey);
        if (cached) return cached;
        if (inFlightRequests.has(cacheKey)) return inFlightRequests.get(cacheKey);

        const now = Date.now();
        requestTimestamps = requestTimestamps.filter(
          (ts) => now - ts < APP_CONFIG.BFF_RATE_LIMIT_WINDOW_MS
        );
        requestTimestamps.push(now);

        const promise = (async () => {
          try {
            stats.apiCalls += 1;
            const result = await fetcherFn();
            stats.validatedPayloads += 1;
            setCached(cacheKey, result);
            return result;
          } finally {
            inFlightRequests.delete(cacheKey);
          }
        })();

        inFlightRequests.set(cacheKey, promise);
        return promise;
      };

      const getTelemetry = () => ({ ...stats, cacheSize: responseCache.size });

      return { buildCacheKey, getCached, setCached, executeProxiedRequest, getTelemetry };
    })();

    const mergeRecipesIntoDatabase = (currentDatabase = [], incomingRecipes = []) => {
      const updatedDb = Array.isArray(currentDatabase) ? [...currentDatabase] : [];
      const seenIds = new Set(updatedDb.map((r) => r?.id).filter(Boolean));
      const seenTitles = new Set(
        updatedDb.map((r) => r?.title?.toLowerCase().trim()).filter(Boolean)
      );

      (incomingRecipes || []).forEach((recipe, idx) => {
        if (!recipe || !recipe.title) return;
        const ensuredId = recipe.id || `db-rec-${Date.now()}-${idx}`;
        let candidateTitle = recipe.title.trim();
        let normTitle = candidateTitle.toLowerCase();

        if (seenIds.has(ensuredId)) return;
        if (seenTitles.has(normTitle)) {
          candidateTitle = `${candidateTitle} (Variante ${updatedDb.length + 1})`;
          normTitle = candidateTitle.toLowerCase();
        }

        seenIds.add(ensuredId);
        seenTitles.add(normTitle);
        updatedDb.push({
          ...recipe,
          id: ensuredId,
          title: candidateTitle,
          basePortions: recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS
        });
      });

      return updatedDb;
    };

    async function callGeminiOrFallbackSingle(userInstruction, currentRecipeContext, userApiKey) {
      const cacheKey = MealMateBffGateway.buildCacheKey('single', {
        userInstruction,
        contextId: currentRecipeContext?.id || null
      });

      return MealMateBffGateway.executeProxiedRequest(cacheKey, async () => {
        if (!userApiKey) {
          await new Promise((r) => setTimeout(r, 450));
          const generated = createSmartLocalVariation(userInstruction, currentRecipeContext);
          const { recipe } = validateAndSanitizeRecipe(generated, 'local');
          return recipe;
        }

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userApiKey.trim())}`;
        const promptText = currentRecipeContext
          ? `Wandle dieses Rezept familienfreundlich & proteinreich (mind. 35g Protein) ab: "${userInstruction}". Rezept: ${JSON.stringify(currentRecipeContext)}`
          : `Erstelle ein familienfreundliches High-Protein Meal-Prep-Rezept (4 Portionen): "${userInstruction}"`;

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        });
        if (!response.ok) throw new Error(`API Status ${response.status}`);
        const result = await response.json();
        const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        const parsed = JSON.parse(rawJson);
        const { valid, recipe } = validateAndSanitizeRecipe(parsed, 'ai');
        if (!valid) throw new Error('Ungültiges Format');
        return recipe;
      });
    }

        );
      };

      const updateSavedRecipesWithPersistence = useCallback((updaterFn) => {
        setSavedRecipes((prev) => {
          const updated = updaterFn(prev);
          OfflineCacheEngine.setItem('mealPlans', updated);
          return updated;
        });
      }, []);

      const addRecipesToDatabaseWithPersistence = useCallback((newRecipes) => {
        const sanitizedIncoming = (newRecipes || [])
          .map((r, i) => validateAndSanitizeRecipe(r, 'db-rec', i))
          .filter((res) => res.valid && res.recipe)
          .map((res) => res.recipe);

        let updatedDbSnapshot = [];
        setRecipeDatabase((prevDb) => {
          const merged = mergeRecipesIntoDatabase(prevDb, sanitizedIncoming);
          updatedDbSnapshot = merged;
          const baseIds = new Set(ALL_RECIPES.map((r) => r.id));
          OfflineCacheEngine.setItem(
            'recipes',
            merged.filter((r) => r && !baseIds.has(r.id))
          );
          return merged;
        });
        return updatedDbSnapshot;
      }, []);

      const currentCard = deck[currentIndex] || null;
      const nextCard = deck[currentIndex + 1] || null;

      const handleShuffleFromDatabase = useCallback(
        (dbSource = recipeDatabase) => {
          const nextRotation = drawRotationDeck(dbSource, APP_CONFIG.INITIAL_DECK_SIZE);
          setDeck(nextRotation);
          setCurrentIndex(0);
          setCardTab('ingredients');
          showTemporaryStatus(`6 zufällige Rezepte (${dbSource.length} im Pool) neu gemischt!`);
        },
        [recipeDatabase, showTemporaryStatus]
      );

      const handleGenerateBatchCards = useCallback(
        async (currentDbSnapshot = recipeDatabase) => {
          if (isGenerating) return;
          setIsGenerating(true);
          setAiStatusMessage('Frische Rezepte werden in die Rotation geladen...');
          try {
            const merged = addRecipesToDatabaseWithPersistence(EXTRA_LOCAL_POOL);
            const activePool = merged.length > 0 ? merged : currentDbSnapshot;
            const nextDeck = drawRotationDeck(activePool, APP_CONFIG.INITIAL_DECK_SIZE);
            setDeck(nextDeck);
            setCurrentIndex(0);
            setCardTab('ingredients');
            showTemporaryStatus(`Neue Rotationsrunde (${activePool.length} Rezepte in DB) bereit!`);
          } finally {
            setIsGenerating(false);
          }
        },
        [recipeDatabase, isGenerating, addRecipesToDatabaseWithPersistence, showTemporaryStatus]
      );

      const triggerDecision = (decision) => {
        if (!currentCard || isGenerating) return;
        setSwipeFeedback(decision);

        setTimeout(() => {
          if (decision === 'like') {
            updateSavedRecipesWithPersistence((prev) => {
              const exists = prev.some((item) => item.recipe.id === currentCard.id);
              if (exists) return prev;
              return [
                ...prev,
                {
                  recipe: currentCard,
                  portions: currentCard.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS,
                  inShoppingList: false,
                  weekday: null,
                  dayPortions: {}
                }
              ];
            });
          }

          const nextIndex = currentIndex + 1;
          setDragX(0);
          setSwipeFeedback(null);
          setCardTab('ingredients');
          setCurrentIndex(nextIndex);

          if (nextIndex >= deck.length) {
            handleGenerateBatchCards(recipeDatabase);
          }
        }, APP_CONFIG.SWIPE_ANIMATION_MS);
      };

      // Touch-optimiertes Swipen für iPhone Safari
      const handlePointerDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.no-drag')) {
          return;
        }
        setIsDragging(true);
        startXRef.current = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
        startYRef.current = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0;
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const currentX = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
        const currentY = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0;
        const dx = currentX - startXRef.current;
        const dy = currentY - startYRef.current;

        // Nur horizontal ziehen, wenn die Bewegung überwiegend seitlich ist
        if (Math.abs(dx) > Math.abs(dy) * 0.8) {
          setDragX(dx);
        }
      };

      const handlePointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (dragX > APP_CONFIG.SWIPE_THRESHOLD_PX) {
          triggerDecision('like');
        } else if (dragX < -APP_CONFIG.SWIPE_THRESHOLD_PX) {
          triggerDecision('nope');
        } else {
          setDragX(0);
        }
      };

      const handleModifyCurrentRecipe = async (instructionText) => {
        const query = instructionText || aiInput.trim();
        if (!query || !currentCard || isGenerating) return;

        setIsGenerating(true);
        setAiStatusMessage(`Rezept wird angepasst...`);
        try {
          const updatedRecipe = await callGeminiOrFallbackSingle(query, currentCard, userApiKey);
          const updatedDb = addRecipesToDatabaseWithPersistence([updatedRecipe]);
          const insertedRecipe =
            updatedDb.find((r) => r.id === updatedRecipe.id) || updatedRecipe;

          setDeck((prev) => {
            const copy = [...prev];
            copy[currentIndex] = insertedRecipe;
            return copy;
          });
          setAiInput('');
          setCardTab('ingredients');
          showTemporaryStatus(`Rezept angepasst & gespeichert!`);
        } catch {
          showTemporaryStatus('Anpassung fehlgeschlagen.', 2500);
        } finally {
          setIsGenerating(false);
        }
      };

      const toggleWeekday = (recipeId, dayShort) => {
        updateSavedRecipesWithPersistence((prev) =>
          prev.map((item) =>
            item.recipe.id === recipeId ? applyWeekdayToggle(item, dayShort) : item
          )
        );
      };

      const updateDayPortion = (recipeId, dayShort, delta) => {
        updateSavedRecipesWithPersistence((prev) =>
          prev.map((item) =>
            item.recipe.id === recipeId ? applyDayPortionDelta(item, dayShort, delta) : item
          )
        );
      };

      const handleToggleShoppingListClick = (item) => {
        if (item.inShoppingList) {
          updateSavedRecipesWithPersistence((prev) =>
            prev.map((entry) =>
              entry.recipe.id === item.recipe.id ? { ...entry, inShoppingList: false } : entry
            )
          );
          if (portionPromptRecipeId === item.recipe.id) {
            setPortionPromptRecipeId(null);
          }
          return;
        }

        const hasPlannedDays = Object.keys(getDayPortions(item)).length > 0;
        if (hasPlannedDays) {
          const total = getTotalPortions(item);
          updateSavedRecipesWithPersistence((prev) =>
            prev.map((entry) =>
              entry.recipe.id === item.recipe.id
                ? { ...entry, inShoppingList: true, portions: total }
                : entry
            )
          );
        } else {
          setPortionPromptRecipeId(item.recipe.id);
          setPromptPortions(getTotalPortions(item));
        }
      };

      const confirmAddToShoppingList = (recipeId) => {
        updateSavedRecipesWithPersistence((prev) =>
          prev.map((entry) =>
            entry.recipe.id === recipeId
              ? { ...entry, inShoppingList: true, portions: promptPortions }
              : entry
          )
        );
        setPortionPromptRecipeId(null);
      };

      const removeSavedRecipe = (recipeId) => {
        updateSavedRecipesWithPersistence((prev) =>
          prev.filter((item) => item.recipe.id !== recipeId)
        );
      };

      const activeShoppingRecipes = useMemo(
        () => savedRecipes.filter((item) => item.inShoppingList),
        [savedRecipes]
      );

      const aggregatedShoppingList = useMemo(
        () => aggregateShoppingList(activeShoppingRecipes),
        [activeShoppingRecipes]
      );

      const totalPlanStats = useMemo(
        () => calculatePlanStats(activeShoppingRecipes, savedRecipes),
        [activeShoppingRecipes, savedRecipes]
      );

      // Unterstützt sowohl das native iPhone Teilen-Menü (Apple Notizen, WhatsApp) als auch Kopieren
      const handleShareOrCopyShoppingList = async () => {
        const formattedText = formatShoppingListText(
          activeShoppingRecipes,
          aggregatedShoppingList,
          checkedItems
        );

        if (navigator.share) {
          try {
            await navigator.share({
              title: 'MealMate Einkaufsliste',
              text: formattedText
            });
            return;
          } catch {
            // Falls Nutzer das Teilen-Menü schließt, normal in Zwischenablage kopieren
          }
        }

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(formattedText);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = formattedText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }
          setCopyToast(true);
          setTimeout(() => setCopyToast(false), APP_CONFIG.TOAST_DURATION_MS);
        } catch {
          showTemporaryStatus('Liste bereit zum Kopieren');
        }
      };

      const rotation = (dragX / APP_CONFIG.SWIPE_ROTATION_DIVISOR).toFixed(2);
      const likeOpacity = clamp(dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);
      const nopeOpacity = clamp(-dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);

      return (
        <div className="min-h-screen bg-[#0B132B] text-slate-100 flex flex-col items-center justify-start ios-safe-container relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-80 h-80 bg-cyan-500/10 rounded-full blur-[90px] pointer-events-none" />
          <div className="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-orange-500/10 rounded-full blur-[90px] pointer-events-none" />

          <IphoneSetupModal
            isOpen={setupModalOpen}
            onClose={() => setSetupModalOpen(false)}
            apiKey={userApiKey}
            onSaveApiKey={handleSaveApiKey}
            testReport={unitTestReport}
          />

          <div className="w-full max-w-[430px] flex flex-col min-h-[92vh] bg-slate-900/85 border border-slate-700/50 rounded-[32px] shadow-2xl overflow-hidden relative backdrop-blur-2xl z-10">
            
            {/* HEADER */}
            <header className="px-4 pt-3.5 pb-3 border-b border-cyan-900/50 bg-slate-950/95 sticky top-0 z-30">
              <div className="flex items-center justify-between mb-2.5">
                <div>
                  <h1 className="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
                    <span>
                      Meal<span className="text-orange-400">Mate</span>
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 font-bold">
                      iOS Ready
                    </span>
                  </h1>
                  <p className="text-[11px] text-cyan-400/80 flex items-center gap-1">
                    <span>Gesundes Vorkochen für Familien</span>
                    {isOnline ? (
                      <Icons.Wifi className="w-3 h-3 text-emerald-400 inline ml-1" />
                    ) : (
                      <Icons.WifiOff className="w-3 h-3 text-amber-400 inline ml-1" />
                    )}
                  </p>
                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setSetupModalOpen(true)}
                    title="iPhone Home-Screen Anleitung & Einstellungen"
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-500/25 text-[11px] font-bold transition"
                  >
                    <Icons.Smartphone className="w-3.5 h-3.5" />
                    <span>iPhone</span>
                  </button>

                  <button
                    onClick={() => setActiveView(activeView === 'swipe' ? 'saved' : 'swipe')}
                    className="relative flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition"
                  >
                    <Icons.Bookmark className="w-3.5 h-3.5 text-orange-400" />
                    <span>{savedRecipes.length}</span>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-1 p-1 bg-slate-950/90 rounded-2xl border border-slate-800/80 text-xs font-semibold">
                <button
                  onClick={() => setActiveView('swipe')}
                  className={`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${
                    activeView === 'swipe'
                      ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20 font-bold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icons.Layers className="w-3.5 h-3.5" />
                  <span>Karten</span>
                </button>
                <button
                  onClick={() => setActiveView('saved')}
                  className={`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${
                    activeView === 'saved'
                      ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20 font-bold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icons.Bookmark className="w-3.5 h-3.5" />
                  <span>Merkliste ({savedRecipes.length})</span>
                </button>
                <button
                  onClick={() => setActiveView('shopping')}
                  className={`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${
                    activeView === 'shopping'
                      ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20 font-bold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icons.ShoppingBag className="w-3.5 h-3.5" />
                  <span>Einkauf ({activeShoppingRecipes.length})</span>
                </button>
              </div>
            </header>

            {(aiStatusMessage || copyToast) && (
              <div className="mx-4 mt-2 px-3.5 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-medium flex items-center gap-2 z-30">
                <Icons.CheckCircle2 className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                <span>{copyToast ? 'Einkaufsliste kopiert!' : aiStatusMessage}</span>
              </div>
            )}

            {/* VIEW 1: SWIPE KARTEN */}
            {activeView === 'swipe' && (
              <main className="flex-1 flex flex-col justify-between p-3.5 overflow-hidden">
                <div className="flex items-center justify-between px-3 py-1.5 mb-2 rounded-2xl bg-slate-950/80 border border-slate-800/90 text-[11px]">
                  <div className="flex items-center gap-1.5 text-slate-300 font-semibold">
                    <Icons.Database className="w-3.5 h-3.5 text-cyan-400 shrink-0" />
                    <span>
                      Pool: <strong className="text-white">{recipeDatabase.length}</strong> Rezepte
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-slate-500 font-semibold">
                      {Math.min(currentIndex + 1, deck.length)}/{deck.length}
                    </span>
                    <button
                      onClick={() => handleShuffleFromDatabase(recipeDatabase)}
                      className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold flex items-center gap-1 border border-slate-700 transition"
                    >
                      <Icons.Shuffle className="w-3 h-3" />
                      <span>Mischen</span>
                    </button>
                  </div>
                </div>

                {currentCard ? (
                  <>
                    <div className="relative flex-1 flex flex-col min-h-[480px]">
                      {nextCard && (
                        <div className="absolute inset-0 top-3 scale-[0.95] opacity-40 bg-slate-800 rounded-[28px] border border-slate-700 pointer-events-none" />
                      )}

                      <div
                        onMouseDown={handlePointerDown}
                        onMouseMove={handlePointerMove}
                        onMouseUp={handlePointerUp}
                        onMouseLeave={handlePointerUp}
                        onTouchStart={handlePointerDown}
                        onTouchMove={handlePointerMove}
                        onTouchEnd={handlePointerUp}
                        style={{
                          transform:
                            swipeFeedback === 'like'
                              ? 'translateX(420px) rotate(16deg)'
                              : swipeFeedback === 'nope'
                              ? 'translateX(-420px) rotate(-16deg)'
                              : `translateX(${dragX}px) rotate(${rotation}deg)`,
                          transition: isDragging ? 'none' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)'
                        }}
                        className="swipe-card-surface relative flex-1 flex flex-col bg-slate-900 border border-slate-700/90 rounded-[28px] shadow-2xl overflow-hidden"
                      >
                        <div
                          style={{ opacity: swipeFeedback === 'like' ? 1 : likeOpacity }}
                          className="pointer-events-none absolute top-6 left-5 z-30 border-4 border-orange-500 text-orange-500 font-black text-lg tracking-widest px-3 py-1 rounded-xl -rotate-12 bg-slate-950/85 shadow-lg"
                        >
                          MERKEN ❤️
                        </div>
                        <div
                          style={{ opacity: swipeFeedback === 'nope' ? 1 : nopeOpacity }}
                          className="pointer-events-none absolute top-6 right-5 z-30 border-4 border-slate-400 text-slate-300 font-black text-lg tracking-widest px-3 py-1 rounded-xl rotate-12 bg-slate-950/85 shadow-lg"
                        >
                          WEITER ✕
                        </div>

                        <div className={`bg-gradient-to-br ${currentCard.accentColor} p-3.5 pb-3 relative`}>
                          <div className="flex items-start justify-between gap-2">
                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-950/45 text-white backdrop-blur-md">
                              <Icons.Clock className="w-3 h-3 text-emerald-300" />
                              {currentCard.prepTimeActive} Min. • {currentCard.effortLevel}
                            </span>
                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-950/45 text-white backdrop-blur-md">
                              <Icons.Snowflake className="w-3 h-3 text-sky-300" />
                              {currentCard.fridgeDays}T Kühl | {currentCard.freezerMonths}M TK
                            </span>
                          </div>

                          <div className="mt-2.5 flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-md flex items-center justify-center text-2xl shadow-inner shrink-0 border border-white/20">
                              {currentCard.emoji}
                            </div>
                            <div>
                              <h2 className="text-base font-extrabold text-white leading-snug">
                                {currentCard.title}
                              </h2>
                              <p className="text-[11px] text-white/85 mt-0.5 line-clamp-2">
                                {currentCard.subtitle}
                              </p>
                            </div>
                          </div>

                          <div className="mt-2 flex items-center gap-1.5 text-[11px] font-semibold text-white/95 bg-black/25 px-2.5 py-1 rounded-xl">
                            <Icons.Baby className="w-3.5 h-3.5 text-amber-300 shrink-0" />
                            <span className="truncate">{currentCard.toddlerNote}</span>
                          </div>
                        </div>

                        <MacroBar
                          calories={currentCard.calories}
                          protein={currentCard.protein}
                          carbs={currentCard.carbs}
                          fat={currentCard.fat}
                        />

                        <div className="flex items-center gap-1 px-3 pt-2 bg-slate-900 no-drag">
                          <button
                            onClick={() => setCardTab('ingredients')}
                            className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${
                              cardTab === 'ingredients'
                                ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30'
                                : 'text-slate-400'
                            }`}
                          >
                            📋 Zutaten ({currentCard.ingredients.length})
                          </button>
                          <button
                            onClick={() => setCardTab('steps')}
                            className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${
                              cardTab === 'steps'
                                ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30'
                                : 'text-slate-400'
                            }`}
                          >
                            👨‍🍳 Schritte ({currentCard.steps.length})
                          </button>
                          <button
                            onClick={() => setCardTab('ai')}
                            className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                              cardTab === 'ai'
                                ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40'
                                : 'text-slate-400'
                            }`}
                          >
                            <Icons.Wand2 className="w-3 h-3" /> Umbau
                          </button>
                        </div>

                        <div className="flex-1 overflow-y-auto ios-scroll px-3.5 py-2.5 space-y-2 no-drag max-h-[230px]">
                          {cardTab === 'ingredients' && (
                            <ul className="space-y-1.5">
                              {currentCard.ingredients.map((ing, idx) => (
                                <li
                                  key={idx}
                                  className="flex items-center justify-between text-xs bg-slate-950/70 border border-slate-800/80 px-3 py-1.5 rounded-xl"
                                >
                                  <span className="text-slate-200 font-medium">{ing.name}</span>
                                  <span className="text-emerald-400 font-bold whitespace-nowrap ml-2">
                                    {ing.amount} {ing.unit}
                                  </span>
                                </li>
                              ))}
                            </ul>
                          )}

                          {cardTab === 'steps' && (
                            <div className="space-y-2">
                              {currentCard.steps.map((step, i) => (
                                <div
                                  key={i}
                                  className="flex items-start gap-2.5 bg-slate-950/70 border border-slate-800/80 p-2.5 rounded-xl text-xs text-slate-200"
                                >
                                  <span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center shrink-0">
                                    {i + 1}
                                  </span>
                                  <p className="leading-relaxed">{step}</p>
                                </div>
                              ))}
                            </div>
                          )}

                          {cardTab === 'ai' && (
                            <div className="space-y-2.5">
                              <p className="text-xs text-slate-300">
                                Rezept direkt anpassen (funktioniert auf dem iPhone auch komplett offline):
                              </p>
                              <div className="flex flex-wrap gap-1.5">
                                {[
                                  'Mit Reis statt Kartoffeln/Nudeln',
                                  'Vegetarisch (mit Hüttenkäse/Quark)',
                                  'Hähnchen durch Rind ersetzen',
                                  'Noch weniger Aufwand (TK)'
                                ].map((chip) => (
                                  <button
                                    key={chip}
                                    disabled={isGenerating}
                                    onClick={() => handleModifyCurrentRecipe(chip)}
                                    className="text-[11px] px-2.5 py-1.5 rounded-xl bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 font-medium"
                                  >
                                    ✨ {chip}
                                  </button>
                                ))}
                              </div>
                              <div className="flex gap-1.5 pt-1">
                                <input
                                  type="text"
                                  value={aiInput}
                                  onChange={(e) => setAiInput(e.target.value)}
                                  placeholder="Eigener Wunsch..."
                                  className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                />
                                <button
                                  onClick={() => handleModifyCurrentRecipe()}
                                  className="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs"
                                >
                                  Umbauen
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="pt-3 flex items-center justify-center gap-5">
                      <button
                        onClick={() => triggerDecision('nope')}
                        className="w-14 h-14 rounded-full bg-slate-900 border-2 border-slate-700 text-slate-400 flex items-center justify-center shadow-lg active:scale-90 transition"
                      >
                        <Icons.X className="w-7 h-7" />
                      </button>

                      <button
                        onClick={() => setCardTab(cardTab === 'ai' ? 'ingredients' : 'ai')}
                        className="px-4 py-2.5 rounded-2xl bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 text-xs font-bold flex items-center gap-1.5 shadow-md"
                      >
                        <Icons.Sparkles className="w-4 h-4 text-cyan-400" />
                        <span>Abwandeln</span>
                      </button>

                      <button
                        onClick={() => triggerDecision('like')}
                        className="w-14 h-14 rounded-full bg-gradient-to-br from-orange-400 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-orange-500/25 active:scale-90 transition"
                      >
                        <Icons.Heart className="w-7 h-7 fill-white" />
                      </button>
                    </div>
                  </>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-4">
                    <div className="w-16 h-16 rounded-3xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-3xl">
                      ✨
                    </div>
                    <h2 className="text-lg font-extrabold text-white">Stapel durchgeswiped!</h2>
                    <button
                      onClick={() => handleShuffleFromDatabase(recipeDatabase)}
                      className="w-full py-3 rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg"
                    >
                      <Icons.Shuffle className="w-4 h-4" />
                      <span>6 zufällige Rezepte neu ziehen</span>
                    </button>
                  </div>
                )}
              </main>
            )}

            {/* VIEW 2: MERKLISTE & WOCHENPLAN */}
            {activeView === 'saved' && (
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-extrabold text-white">Merkliste & Wochenplan</h2>
                      <p className="text-[11px] text-slate-400">
                        Wochentage antippen & Portionen verteilen
                      </p>
                    </div>
                    <span className="px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-400 text-xs font-extrabold border border-emerald-500/30">
                      {activeShoppingRecipes.length} / {savedRecipes.length} aktiv
                    </span>
                  </div>

                  {savedRecipes.length > 0 && (
                    <div className="grid grid-cols-7 gap-1 pt-2 border-t border-slate-800">
                      {WEEKDAYS.map((day) => {
                        const sum = savedRecipes.reduce(
                          (acc, r) => acc + (getDayPortions(r)[day.short] || 0),
                          0
                        );
                        const isSelected = weekdayFilter === day.short;
                        return (
                          <button
                            key={day.short}
                            onClick={() =>
                              setWeekdayFilter(weekdayFilter === day.short ? 'Alle' : day.short)
                            }
                            className={`py-1.5 rounded-xl border text-center flex flex-col items-center ${
                              isSelected
                                ? 'bg-emerald-500 text-slate-950 border-emerald-400 font-extrabold'
                                : sum > 0
                                ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 font-bold'
                                : 'bg-slate-900 border-slate-800 text-slate-400'
                            }`}
                          >
                            <span className="text-[11px]">{day.short}</span>
                            <span className="text-[9px]">{sum > 0 ? `${sum}P` : '–'}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

                {savedRecipes.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center text-center py-12 px-4">
                    <Icons.ChefHat className="w-12 h-12 text-slate-600 mb-3" />
                    <p className="text-sm font-bold text-slate-300">Noch keine Rezepte gemerkt</p>
                    <button
                      onClick={() => setActiveView('swipe')}
                      className="mt-4 px-4 py-2.5 rounded-2xl bg-emerald-500 text-slate-950 font-bold text-xs"
                    >
                      Jetzt Rezepte swipen
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3 pb-4">
                    {savedRecipes
                      .filter(
                        (item) =>
                          weekdayFilter === 'Alle' || (getDayPortions(item)[weekdayFilter] || 0) > 0
                      )
                      .map((item) => {
                        const { recipe, inShoppingList } = item;
                        const dayPortions = getDayPortions(item);
                        const activeDays = WEEKDAYS.filter((d) => dayPortions[d.short] > 0);
                        const totalPortions = getTotalPortions(item);
                        const isPromptOpen = portionPromptRecipeId === recipe.id;

                        return (
                          <div
                            key={recipe.id}
                            className={`bg-slate-950/90 border rounded-2xl p-3.5 space-y-3 ${
                              inShoppingList ? 'border-emerald-500/60' : 'border-slate-800'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex items-center gap-2.5">
                                <span className="text-2xl">{recipe.emoji}</span>
                                <div>
                                  <h3 className="text-xs font-extrabold text-white">
                                    {recipe.title}
                                  </h3>
                                  <p className="text-[11px] text-emerald-400 font-semibold">
                                    {recipe.calories} kcal • {recipe.protein}g Protein
                                  </p>
                                </div>
                              </div>
                              <button
                                onClick={() => removeSavedRecipe(recipe.id)}
                                className="p-1.5 rounded-xl text-slate-500 hover:text-rose-400"
                              >
                                <Icons.Trash2 className="w-4 h-4" />
                              </button>
                            </div>

                            <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 space-y-2">
                              <div className="grid grid-cols-7 gap-1">
                                {WEEKDAYS.map((day) => {
                                  const count = dayPortions[day.short] || 0;
                                  const active = count > 0;
                                  return (
                                    <button
                                      key={day.short}
                                      onClick={() => toggleWeekday(recipe.id, day.short)}
                                      className={`py-1.5 rounded-lg text-[11px] font-bold border flex flex-col items-center ${
                                        active
                                          ? 'bg-indigo-500 text-white border-indigo-400'
                                          : 'bg-slate-950 text-slate-400 border-slate-800'
                                      }`}
                                    >
                                      <span>{day.short}</span>
                                      {active && <span className="text-[9px]">{count}P</span>}
                                    </button>
                                  );
                                })}
                              </div>

                              {activeDays.map((day) => (
                                <div
                                  key={day.short}
                                  className="flex items-center justify-between bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800"
                                >
                                  <span className="text-xs font-bold text-slate-200">{day.full}</span>
                                  <div className="flex items-center gap-2">
                                    <button
                                      onClick={() => updateDayPortion(recipe.id, day.short, -1)}
                                      className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"
                                    >
                                      <Icons.Minus className="w-3 h-3" />
                                    </button>
                                    <span className="text-xs font-black text-cyan-400 w-12 text-center">
                                      {dayPortions[day.short]} P.
                                    </span>
                                    <button
                                      onClick={() => updateDayPortion(recipe.id, day.short, 1)}
                                      className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"
                                    >
                                      <Icons.Plus className="w-3 h-3" />
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>

                            {!inShoppingList && !isPromptOpen && (
                              <button
                                onClick={() => handleToggleShoppingListClick(item)}
                                className="w-full py-2.5 px-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-xs font-bold flex items-center justify-between"
                              >
                                <span>Zur Einkaufsliste hinzufügen</span>
                                <span className="text-emerald-400">{totalPortions} Port.</span>
                              </button>
                            )}

                            {isPromptOpen && (
                              <div className="bg-emerald-950/30 border border-emerald-500/50 rounded-xl p-3 space-y-2">
                                <div className="flex items-center justify-between">
                                  <span className="text-xs font-bold text-emerald-300">Portionen wählen:</span>
                                  <div className="flex items-center gap-2">
                                    <button
                                      onClick={() => setPromptPortions((p) => clamp(p - 1, 1, 20))}
                                      className="w-7 h-7 rounded-lg bg-slate-800 text-white flex items-center justify-center"
                                    >
                                      <Icons.Minus className="w-3.5 h-3.5" />
                                    </button>
                                    <span className="text-sm font-black text-emerald-400 w-12 text-center">
                                      {promptPortions}
                                    </span>
                                    <button
                                      onClick={() => setPromptPortions((p) => clamp(p + 1, 1, 20))}
                                      className="w-7 h-7 rounded-lg bg-slate-800 text-white flex items-center justify-center"
                                    >
                                      <Icons.Plus className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                </div>
                                <button
                                  onClick={() => confirmAddToShoppingList(recipe.id)}
                                  className="w-full py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs"
                                >
                                  Mit {promptPortions} Portionen übernehmen
                                </button>
                              </div>
                            )}

                            {inShoppingList && (
                              <div className="flex items-center justify-between bg-emerald-500/10 px-3 py-2 rounded-xl border border-emerald-500/30">
                                <button
                                  onClick={() => handleToggleShoppingListClick(item)}
                                  className="text-xs font-extrabold text-emerald-300 flex items-center gap-2"
                                >
                                  <Icons.Check className="w-4 h-4" />
                                  <span>Auf der Einkaufsliste ({formatDaySchedule(item) || `${totalPortions}P`})</span>
                                </button>
                                <span className="text-xs font-black text-emerald-400">∑ {totalPortions}P</span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>
                )}
              </main>
            )}

            {/* VIEW 3: EINKAUFSLISTE MIT IPHONE-SHARE */}
            {activeView === 'shopping' && (
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                <div className="flex items-center justify-between bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5">
                  <div>
                    <h2 className="text-sm font-extrabold text-white">Smarte Einkaufsliste</h2>
                    <p className="text-[11px] text-slate-400">
                      Summiert für {totalPlanStats.totalPortions} Portionen
                    </p>
                  </div>
                  {activeShoppingRecipes.length > 0 && (
                    <button
                      onClick={handleShareOrCopyShoppingList}
                      className="px-3 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                    >
                      <Icons.Share2 className="w-3.5 h-3.5" />
                      <span>Teilen / Kopieren</span>
                    </button>
                  )}
                </div>

                {activeShoppingRecipes.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center text-center py-12 px-4">
                    <Icons.ShoppingBag className="w-12 h-12 text-slate-600 mb-3" />
                    <p className="text-sm font-bold text-slate-300">Einkaufsliste ist noch leer</p>
                    <button
                      onClick={() => setActiveView('saved')}
                      className="mt-4 px-4 py-2.5 rounded-2xl bg-emerald-500 text-slate-950 font-bold text-xs"
                    >
                      Zur Merkliste
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3 pb-4">
                    {CATEGORY_ORDER.map(({ key, icon, badge }) => {
                      const items = aggregatedShoppingList[key] || [];
                      if (items.length === 0) return null;
                      return (
                        <div
                          key={key}
                          className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-2"
                        >
                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border ${badge}`}>
                            <span>{icon}</span>
                            <span>{key}</span>
                          </span>
                          <div className="divide-y divide-slate-800/60">
                            {items.map((item) => {
                              const isChecked = !!checkedItems[item.id];
                              return (
                                <div
                                  key={item.id}
                                  onClick={() =>
                                    setCheckedItems((prev) => {
                                      const next = { ...prev, [item.id]: !prev[item.id] };
                                      OfflineCacheEngine.setItem('checkedItems', next);
                                      return next;
                                    })
                                  }
                                  className="py-2 flex items-center justify-between gap-2 cursor-pointer"
                                >
                                  <div className="flex items-center gap-2.5">
                                    <div
                                      className={`w-4 h-4 rounded-md border flex items-center justify-center ${
                                        isChecked
                                          ? 'bg-emerald-500 border-emerald-500 text-slate-950'
                                          : 'border-slate-600'
                                      }`}
                                    >
                                      {isChecked && <Icons.Check className="w-3 h-3" />}
                                    </div>
                                    <div>
                                      <div className={`text-xs font-medium ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                        {item.name}
                                      </div>
                                      <div className="text-[10px] text-slate-500">
                                        {item.sources.join(', ')}
                                      </div>
                                    </div>
                                  </div>
                                  <span className={`text-xs font-extrabold ${isChecked ? 'line-through text-slate-600' : 'text-emerald-400'}`}>
                                    {item.amount} {item.unit}
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </main>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
