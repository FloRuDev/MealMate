                                      <button onClick=${() => setSavedRecipes(prev => prev.map(e => e.recipe.id === recipe.id ? applyDayPortionDelta(e, day.short, -1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Minus} className="w-3 h-3" /></button>
                                      <span className="text-xs font-black text-cyan-400 w-14 text-center">${dayPortions[day.short]} Port.</span>
                                      <button onClick=${() => setSavedRecipes(prev => prev.map(e => e.recipe.id === recipe.id ? applyDayPortionDelta(e, day.short, 1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Plus} className="w-3 h-3" /></button>
                                    </div>
                                  </div>
                                `)}
                              </div>
                            ` : html`
                              <div className="pt-1.5 border-t border-slate-800/80 flex items-center justify-between bg-slate-950/60 px-2.5 py-1.5 rounded-lg">
                                <span className="text-[11px] text-slate-300 font-medium">Portionen (ohne festen Tag):</span>
                                <div className="flex items-center gap-2">
                                  <button onClick=${() => setSavedRecipes(prev => prev.map(e => e.recipe.id === recipe.id ? applyBasePortionDelta(e, -1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Minus} className="w-3 h-3" /></button>
                                  <span className="text-xs font-black text-cyan-400 w-14 text-center">${totalPortions} Port.</span>
                                  <button onClick=${() => setSavedRecipes(prev => prev.map(e => e.recipe.id === recipe.id ? applyBasePortionDelta(e, 1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Plus} className="w-3 h-3" /></button>
                                </div>
                              </div>
                            `}
                          </div>
                        </div>
                      `;
                    })}
                  </div>

                  <!-- STICKY BOTTOM CHECKOUT BEREICH (UX Best Practice) -->
                  <div className="bg-slate-950/95 border border-emerald-500/30 rounded-2xl p-4 space-y-2.5 mt-4 sticky bottom-2 shadow-2xl backdrop-blur-md">
                    <label className="text-xs font-extrabold text-emerald-400 flex items-center gap-1.5">
                      <span>📅 Als Wochenplan in „MyPrep“ speichern:</span>
                    </label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value=${newPlanName}
                        onChange=${(e) => setNewPlanName(e.target.value)}
                        onKeyDown=${(e) => e.key === 'Enter' && handleSaveWeeklyPlan()}
                        placeholder="Name (z.B. KW 45 – Familienwoche)..."
                        className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                      />
                      <button
                        onClick=${handleSaveWeeklyPlan}
                        className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-extrabold text-xs flex items-center gap-1 shadow-md shrink-0 active:scale-95 transition"
                      >
                        <${Icons.Check} className="w-4 h-4 stroke-[3]" />
                        <span>Speichern & Leeren</span>
                      </button>
                    </div>
                  </div>
                `}
              </main>
            ` : ''}

            ${activeView === 'myprep' ? html`
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                ${!selectedPlan ? html`
                  <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-extrabold text-white flex items-center gap-1.5">
                        <${Icons.Calendar} className="w-4 h-4 text-cyan-400" />
                        <span>MyPrep – Meine Wochenpläne</span>
                      </h2>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        Wähle einen Plan zum Nachkochen oder für den Einkaufszettel
                      </p>
                    </div>
                    <span className="px-2.5 py-1 rounded-xl bg-cyan-500/15 text-cyan-300 text-xs font-extrabold border border-cyan-500/30">
                      ${weeklyPlans.length} Pläne
                    </span>
                  </div>

                  ${weeklyPlans.length === 0 ? html`
                    <div className="flex-1 flex flex-col items-center justify-center text-center py-12 px-4">
                      <${Icons.Calendar} className="w-12 h-12 text-slate-600 mb-3" />
                      <p className="text-sm font-bold text-slate-300">Noch kein Wochenplan gespeichert</p>
                      <p className="text-xs text-slate-500 mt-1 mb-4">
                        Stelle dir in der Merkliste deine Gerichte und Wochentage zusammen und speichere sie unter einem Namen ab.
                      </p>
                      <button
                        onClick=${() => setActiveView('saved')}
                        className="px-4 py-2.5 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold text-xs"
                      >
                        Zur Merkliste (${savedRecipes.length})
                      </button>
                    </div>
                  ` : html`
                    <div className="space-y-4 pb-4">
                      <!-- AKTUELLER PLAN (ERSTER PLAN) -->
                      ${weeklyPlans.length > 0 ? html`
                        <div className="space-y-2">
                          <div className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider flex items-center gap-1">✨ Aktueller Wochenplan</div>
                          ${(() => {
                            const plan = weeklyPlans[0];
                            const stats = calculatePlanStats(plan.items);
                            const checkedCount = Object.values(plan.checkedItems || {}).filter(Boolean).length;
                            return html`
                              <div
                                key=${plan.id}
                                onClick=${() => { setSelectedPlanId(plan.id); setPlanSubView('schedule'); setPlanDayFilter('Alle'); }}
                                className="bg-slate-950/95 border-2 border-cyan-500/50 rounded-2xl p-4 space-y-3 cursor-pointer transition shadow-xl"
                              >
                                <div className="flex items-start justify-between gap-2">
                                  <div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                                        📅 ${plan.createdAt}
                                      </span>
                                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                                        ∑ ${stats.totalPortions} Portionen
                                      </span>
                                    </div>
                                    <h3 className="text-sm font-extrabold text-white mt-1.5">${plan.name}</h3>
                                    <p className="text-[11px] text-slate-400 mt-0.5">
                                      ${plan.items.length} Gerichte • Ø ${stats.avgCalories} kcal • Ø ${stats.avgProtein}g Protein
                                    </p>
                                  </div>
                                  <button
                                    onClick=${(e) => handleDeleteWeeklyPlan(plan.id, e)}
                                    className="p-1.5 rounded-xl text-slate-500 hover:text-rose-400 hover:bg-slate-900"
                                    title="Wochenplan löschen"
                                  >
                                    <${Icons.Trash2} className="w-4 h-4" />
                                  </button>
                                </div>

                                <div className="flex flex-wrap gap-1.5 pt-1">
                                  ${plan.items.map((it) => {
                                    const sched = formatDaySchedule(it);
                                    const { title: shortItemTitle } = extractConciseTitleAndSubtitle(it.recipe.title, it.recipe.subtitle);
                                    return html`
                                      <span key=${it.recipe.id} className="text-[10px] px-2 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-200 flex items-center gap-1">
                                        <span>${it.recipe.emoji}</span>
                                        <span className="truncate max-w-[140px] font-medium">${shortItemTitle}</span>
                                        ${sched ? html`<span className="text-indigo-300 font-bold">(${sched})</span>` : ''}
                                      </span>
                                    `;
                                  })}
                                </div>

                                <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between gap-2">
                                  <button
                                    onClick=${(e) => { e.stopPropagation(); setSelectedPlanId(plan.id); setPlanSubView('schedule'); }}
                                    className="flex-1 py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-300 text-xs font-bold flex items-center justify-center gap-1.5"
                                  >
                                    <${Icons.ChefHat} className="w-3.5 h-3.5" />
                                    <span>Tage & Rezepte</span>
                                  </button>
                                  <button
                                    onClick=${(e) => { e.stopPropagation(); setSelectedPlanId(plan.id); setPlanSubView('shopping'); }}
                                    className="flex-1 py-2 px-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center justify-center gap-1.5"
                                  >
                                    <${Icons.ShoppingBag} className="w-3.5 h-3.5" />
                                    <span>Einkaufszettel ${checkedCount > 0 ? `(${checkedCount} ✓)` : ''}</span>
                                  </button>
                                </div>
                              </div>
                            `;
                          })()}
                        </div>
                      ` : ''}

                      <!-- ARCHIV (WEITERE PLÄNE) -->
                      ${weeklyPlans.length > 1 ? html`
                        <div className="space-y-2 pt-2">
                          <div className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider flex items-center gap-1">🗂️ Archivierte Pläne</div>
                          ${weeklyPlans.slice(1).map((plan) => {
                            const stats = calculatePlanStats(plan.items);
                            return html`
                              <div
                                key=${plan.id}
                                onClick=${() => { setSelectedPlanId(plan.id); setPlanSubView('schedule'); setPlanDayFilter('Alle'); }}
                                className="bg-slate-950/70 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-3.5 space-y-2.5 cursor-pointer transition opacity-85 hover:opacity-100"
                              >
                                <div className="flex items-start justify-between gap-2">
                                  <div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-900 text-slate-400 border border-slate-800">
                                        📅 ${plan.createdAt}
                                      </span>
                                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-900 text-slate-400 border border-slate-800">
                                        ∑ ${stats.totalPortions} Port.
                                      </span>
                                    </div>
                                    <h3 className="text-xs font-extrabold text-slate-200 mt-1">${plan.name}</h3>
                                  </div>
                                  <button
                                    onClick=${(e) => handleDeleteWeeklyPlan(plan.id, e)}
                                    className="p-1 rounded-lg text-slate-600 hover:text-rose-400"
                                    title="Wochenplan löschen"
                                  >
                                    <${Icons.Trash2} className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                                <div className="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-900">
                                  <span>${plan.items.length} Gerichte • Ø ${stats.avgCalories} kcal</span>
                                  <span className="text-cyan-400 font-bold">Öffnen →</span>
                                </div>
                              </div>
                            `;
                          })}
                        </div>
                      ` : ''}
                    </div>
                  `}
                ` : html`
                  <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <button
                        onClick=${() => setSelectedPlanId(null)}
                        className="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 hover:text-white text-xs font-bold"
                      >
                        <${Icons.ArrowLeft} className="w-3.5 h-3.5" />
                        <span>Alle Pläne</span>
                      </button>
                      <span className="text-[11px] font-bold text-cyan-300 bg-cyan-500/15 px-2.5 py-1 rounded-xl border border-cyan-500/30">
                        ∑ ${selectedPlanStats.totalPortions} Portionen
                      </span>
                    </div>

                    <div>
                      <h2 className="text-base font-extrabold text-white">${selectedPlan.name}</h2>
                      <p className="text-[11px] text-slate-400">
                        Erstellt am ${selectedPlan.createdAt} • ${selectedPlan.items.length} Rezepte • Ø ${selectedPlanStats.avgProtein}g Protein
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs font-bold">
                      <button
                        onClick=${() => setPlanSubView('schedule')}
                        className=${`py-2 rounded-lg flex items-center justify-center gap-1.5 transition ${planSubView === 'schedule' ? 'bg-cyan-500 text-slate-950 font-extrabold shadow' : 'text-slate-400'}`}
                      >
                        <${Icons.Calendar} className="w-3.5 h-3.5" />
                        <span>Wochentage & Kochen</span>
                      </button>
                      <button
                        onClick=${() => setPlanSubView('shopping')}
                        className=${`py-2 rounded-lg flex items-center justify-center gap-1.5 transition ${planSubView === 'shopping' ? 'bg-emerald-500 text-slate-950 font-extrabold shadow' : 'text-slate-400'}`}
                      >
                        <${Icons.ShoppingBag} className="w-3.5 h-3.5" />
                        <span>Einkaufszettel</span>
                      </button>
                    </div>
                  </div>

                  ${planSubView === 'schedule' ? html`
                    <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3 space-y-2">
                      <div className="flex items-center justify-between text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                        <span>Tag filtern (Tippe auf ein Gericht zum Nachkochen)</span>
                        ${planDayFilter !== 'Alle' ? html`
                          <button onClick=${() => setPlanDayFilter('Alle')} className="text-cyan-400 hover:underline">Alle Tage</button>
                        ` : ''}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        ${WEEKDAYS.map((day) => {
                          const sum = selectedPlan.items.reduce((s, r) => s + (getDayPortions(r)[day.short] || 0), 0);
                          const isSelected = planDayFilter === day.short;
                          return html`
                            <button
                              key=${day.short}
                              onClick=${() => setPlanDayFilter(planDayFilter === day.short ? 'Alle' : day.short)}
                              className=${`py-1.5 rounded-xl border text-center flex flex-col items-center justify-center ${isSelected ? 'bg-cyan-500 text-slate-950 border-cyan-400 font-extrabold' : sum > 0 ? 'bg-indigo-500/20 border-indigo-500/40 text-indigo-200 font-bold' : 'bg-slate-900 border-slate-800 text-slate-500'}`}
                            >
                              <span className="text-[11px]">${day.short}</span>
                              <span className="text-[9px] mt-0.5">${sum > 0 ? `${sum}P` : '–'}</span>
                            </button>
                          `;
                        })}
                      </div>
                    </div>

                    <div className="space-y-3 pb-4">
                      ${WEEKDAYS.filter((d) => planDayFilter === 'Alle' || planDayFilter === d.short).map((day) => {
                        const dayMeals = selectedPlan.items.filter((it) => (getDayPortions(it)[day.short] || 0) > 0);
                        if (dayMeals.length === 0) return null;
                        return html`
                          <div key=${day.short} className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                            <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                              <span className="text-xs font-extrabold text-indigo-300 flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                                <span>${day.full}</span>
                              </span>
                              <span className="text-[11px] font-bold text-slate-400">
                                ${dayMeals.reduce((acc, m) => acc + (getDayPortions(m)[day.short] || 0), 0)} Portionen
                              </span>
                            </div>
                            <div className="space-y-2">
                              ${dayMeals.map((item) => {
                                const { title: shortMealTitle } = extractConciseTitleAndSubtitle(item.recipe.title, item.recipe.subtitle);
                                return html`
                                  <div
                                    key=${`${day.short}-${item.recipe.id}`}
                                    onClick=${() => setCookingModalItem(item)}
                                    className="flex items-center justify-between gap-2 bg-slate-900 hover:bg-slate-800/90 border border-slate-800 p-2.5 rounded-xl cursor-pointer transition"
                                  >
                                    <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                      <span className="text-2xl shrink-0">${item.recipe.emoji}</span>
                                      <div className="min-w-0 flex-1">
                                        <h4 className="text-xs font-extrabold text-white truncate">${shortMealTitle}</h4>
                                        <p className="text-[10px] text-emerald-400 font-semibold">
                                          Für ${day.full}: ${getDayPortions(item)[day.short]} Port. (Gesamt: ${getTotalPortions(item)}P)
                                        </p>
                                      </div>
                                    </div>
                                    <span className="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-[11px] font-extrabold shrink-0 flex items-center gap-1">
                                      <${Icons.ChefHat} className="w-3.5 h-3.5" />
                                      <span>Kochen</span>
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })}

                      ${planDayFilter === 'Alle' ? (() => {
                        const unassignedMeals = selectedPlan.items.filter((it) => Object.keys(getDayPortions(it)).length === 0);
                        if (unassignedMeals.length === 0) return null;
                        return html`
                          <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                            <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                              <span className="text-xs font-extrabold text-amber-300">Flexibel eingeplante Gerichte (ohne festen Wochentag)</span>
                            </div>
                            <div className="space-y-2">
                              ${unassignedMeals.map((item) => {
                                const { title: shortMealTitle } = extractConciseTitleAndSubtitle(item.recipe.title, item.recipe.subtitle);
                                return html`
                                  <div
                                    key=${item.recipe.id}
                                    onClick=${() => setCookingModalItem(item)}
                                    className="flex items-center justify-between gap-2 bg-slate-900 hover:bg-slate-800/90 border border-slate-800 p-2.5 rounded-xl cursor-pointer transition"
                                  >
                                    <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                      <span className="text-2xl shrink-0">${item.recipe.emoji}</span>
                                      <div className="min-w-0 flex-1">
                                        <h4 className="text-xs font-extrabold text-white truncate">${shortMealTitle}</h4>
                                        <p className="text-[10px] text-emerald-400 font-semibold">${getTotalPortions(item)} Portionen eingeplant</p>
                                      </div>
                                    </div>
                                    <span className="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-[11px] font-extrabold shrink-0 flex items-center gap-1">
                                      <${Icons.ChefHat} className="w-3.5 h-3.5" />
                                      <span>Kochen</span>
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })() : ''}
                    </div>
                  ` : html`
                    <div className="flex items-center justify-between bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5">
                      <div>
                        <h2 className="text-sm font-extrabold text-white">Smarte Einkaufsliste</h2>
                        <p className="text-[11px] text-slate-400">Summiert für ${selectedPlanStats.totalPortions} Portionen (${selectedPlan.name})</p>
                      </div>
                      <button
                        onClick=${handleCopyPlanShoppingList}
                        className="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                      >
                        <${Icons.Copy} className="w-3.5 h-3.5" />
                        <span>Kopieren</span>
                      </button>
                    </div>

                    <div className="space-y-4 pb-4">
                      ${CATEGORY_ORDER.map(({ key, icon, badge }) => {
                        const items = selectedPlanShoppingList[key] || [];
                        if (items.length === 0) return null;
                        const planChecked = selectedPlan.checkedItems || {};
                        return html`
                          <div key=${key} className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className=${`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border ${badge}`}>
                                <span>${icon}</span>
                                <span>${key}</span>
                              </span>
                            </div>
                            <div className="divide-y divide-slate-800/60">
                              ${items.map((item) => {
                                const isChecked = !!planChecked[item.id];
                                return html`
                                  <div
                                    key=${item.id}
                                    onClick=${() => handleTogglePlanShoppingItem(selectedPlan.id, item.id)}
                                    className="py-2 flex items-center justify-between gap-2 cursor-pointer"
                                  >
                                    <div className="flex items-center gap-2.5">
                                      <div className=${`w-4 h-4 rounded-md border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>
                                        ${isChecked ? html`<${Icons.Check} className="w-3 h-3 stroke-[3]" />` : ''}
                                      </div>
                                      <div>
                                        <div className=${`text-xs font-medium ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}`}>${item.name}</div>
                                        <div className="text-[10px] text-slate-500 truncate max-w-[210px]">Für: ${item.sources.join(', ')}</div>
                                      </div>
                                    </div>
                                    <span className=${`text-xs font-extrabold whitespace-nowrap ${isChecked ? 'line-through text-slate-600' : 'text-emerald-400'}`}>
                                      ${item.amount} ${item.unit}
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })}
                    </div>
                  `}
                `}
              </main>
            ` : ''}
          </div>
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
