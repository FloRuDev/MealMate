<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MealMate – Familien Meal-Prep</title>

  <!-- iOS Web-App (PWA) Meta-Tags für Vollbild auf dem iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MealMate" />
  <meta name="theme-color" content="#0B132B" />

  <!-- App-Icon für den iPhone Home-Bildschirm -->
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/0891b2/ffffff?text=MM" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- React 18 + HTM (Schneller Start ohne Babel-Compiler) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <!-- Externe Datenbank-Datei mit 50 Standardrezepten (für GitHub Pages & lokal) -->
  <script src="rezepte.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0B132B;
      color: #f1f5f9;
      overscroll-behavior-y: none;
      margin: 0;
      padding: 0;
    }
    .ios-safe-container {
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }
    .ios-scroll {
      -webkit-overflow-scrolling: touch;
    }
    .swipe-card-surface {
      touch-action: pan-y;
    }
    .instant-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .instant-card {
      width: 100%;
      max-width: 430px;
      min-height: 92vh;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 32px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }
    .skeleton-pulse {
      animation: pulseGlow 1.3s ease-in-out infinite;
      background: rgba(30, 41, 59, 0.85);
      border-radius: 20px;
    }
  </style>
</head>
<body class="bg-[#0B132B] text-slate-100 min-h-screen select-none">

  <!-- Instant App-Shell: Sofort sichtbar während React im Hintergrund startet -->
  <div id="root">
    <div class="instant-shell ios-safe-container">
      <div class="instant-card">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div>
              <div style="font-size:16px;font-weight:800;color:#fff;">
                Meal<span style="color:#fb923c;">Mate</span>
              </div>
              <div style="font-size:11px;color:#22d3ee;">Gesundes Vorkochen für Familien</div>
            </div>
          </div>
          <div class="skeleton-pulse" style="height:38px;margin-bottom:16px;"></div>
          <div class="skeleton-pulse" style="height:440px;"></div>
        </div>
        <div style="display:flex;justify-content:center;gap:20px;padding-top:12px;">
          <div class="skeleton-pulse" style="width:56px;height:56px;border-radius:999px;"></div>
          <div class="skeleton-pulse" style="width:110px;height:42px;border-radius:16px;align-self:center;"></div>
          <div class="skeleton-pulse" style="width:56px;height:56px;border-radius:999px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { useState, useRef, useEffect, useMemo, useCallback } = React;
    const html = htm.bind(React.createElement);

    // ============================================================================
    // INLINE SVG ICONS
    // ============================================================================
    const IconBase = ({ children, className = "w-4 h-4", ...props }) => html`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className=${className}
        ...${props}
      >
        ${children}
      </svg>
    `;

    const Icons = {
      Heart: (p) => html`<${IconBase} ...${p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /><//>`,
      X: (p) => html`<${IconBase} ...${p}><path d="M18 6 6 18" /><path d="m6 6 12 12" /><//>`,
      Sparkles: (p) => html`<${IconBase} ...${p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><//>`,
      ShoppingBag: (p) => html`<${IconBase} ...${p}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /><//>`,
      Clock: (p) => html`<${IconBase} ...${p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /><//>`,
      ChefHat: (p) => html`<${IconBase} ...${p}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" /><line x1="6" x2="18" y1="17" y2="17" /><//>`,
      Check: (p) => html`<${IconBase} ...${p}><path d="M20 6 9 17l-5-5" /><//>`,
      RefreshCw: (p) => html`<${IconBase} ...${p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /><//>`,
      Bookmark: (p) => html`<${IconBase} ...${p}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z" /><//>`,
      Calendar: (p) => html`<${IconBase} ...${p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /><//>`,
      Copy: (p) => html`<${IconBase} ...${p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /><//>`,
      Trash2: (p) => html`<${IconBase} ...${p}><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><//>`,
      Plus: (p) => html`<${IconBase} ...${p}><path d="M5 12h14" /><path d="M12 5v14" /><//>`,
      Minus: (p) => html`<${IconBase} ...${p}><path d="M5 12h14" /><//>`,
      Snowflake: (p) => html`<${IconBase} ...${p}><line x1="2" x2="22" y1="12" y2="12" /><line x1="12" x2="12" y1="2" y2="22" /><path d="m20 16-4-4 4-4" /><path d="m4 8 4 4-4 4" /><//>`,
      Baby: (p) => html`<${IconBase} ...${p}><circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><line x1="9" x2="9.01" y1="9" y2="9" /><line x1="15" x2="15.01" y1="9" y2="9" /><//>`,
      Dumbbell: (p) => html`<${IconBase} ...${p}><path d="m6.5 6.5 11 11" /><path d="m21 21-1-1" /><path d="m3 3 1 1" /><path d="m18 22 4-4" /><path d="m2 6 4-4" /><path d="m3 10 7-7" /><path d="m14 21 7-7" /><//>`,
      Zap: (p) => html`<${IconBase} ...${p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /><//>`,
      Droplet: (p) => html`<${IconBase} ...${p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /><//>`,
      Wand2: (p) => html`<${IconBase} ...${p}><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z" /><path d="m14 7 3 3" /><//>`,
      CheckCircle2: (p) => html`<${IconBase} ...${p}><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /><//>`,
      ChevronRight: (p) => html`<${IconBase} ...${p}><path d="m9 18 6-6-6-6" /><//>`,
      ArrowLeft: (p) => html`<${IconBase} ...${p}><path d="m15 18-6-6 6-6" /><//>`,
      Layers: (p) => html`<${IconBase} ...${p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /><//>`,
      Database: (p) => html`<${IconBase} ...${p}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /><//>`,
      Smartphone: (p) => html`<${IconBase} ...${p}><rect width="14" height="20" x="5" y="2" rx="2" ry="2" /><path d="M12 18h.01" /><//>`,
      Search: (p) => html`<${IconBase} ...${p}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /><//>`,
      Star: (p) => html`<${IconBase} ...${p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /><//>`
    };

    // ============================================================================
    // KONFIGURATION & BASIS-DATENBANK
    // ============================================================================
    const APP_CONFIG = Object.freeze({
      INITIAL_DECK_SIZE: 6,
      AI_ROTATION_FEED_COUNT: 6,
      DEFAULT_BASE_PORTIONS: 4,
      DEFAULT_DAY_PORTIONS: 3,
      MIN_PORTIONS: 1,
      MAX_DAY_PORTIONS: 12,
      MAX_TOTAL_PORTIONS: 20,
      SWIPE_THRESHOLD_PX: 85,
      SWIPE_ROTATION_DIVISOR: 18,
      SWIPE_OPACITY_DIVISOR: 85,
      SWIPE_ANIMATION_MS: 220,
      TOAST_DURATION_MS: 2500,
      IDB_NAME: 'MealMateOfflineDB_v3',
      IDB_VERSION: 1
    });

    const WEEKDAYS = [
      { short: 'Mo', full: 'Montag' },
      { short: 'Di', full: 'Dienstag' },
      { short: 'Mi', full: 'Mittwoch' },
      { short: 'Do', full: 'Donnerstag' },
      { short: 'Fr', full: 'Freitag' },
      { short: 'Sa', full: 'Samstag' },
      { short: 'So', full: 'Sonntag' }
    ];

    const RECIPE_THEME_COLORS = Object.freeze({
      POULTRY: 'from-amber-500 to-orange-600',
      BEEF: 'from-red-600 to-rose-700',
      FISH: 'from-cyan-600 to-blue-700',
      VEGGIE: 'from-emerald-600 to-teal-700'
    });

    const determineSemanticRecipeColor = (title = '', ingredients = []) => {
      const combinedText = `${title} ${(ingredients || []).map((i) => i?.name || '').join(' ')}`.toLowerCase();
      if (/lachs|seelachs|kabeljau|fisch|thunfisch|forelle|garnele/.test(combinedText)) {
        return RECIPE_THEME_COLORS.FISH;
      }
      if (/rind|rinder|tartar|bolognese vom rind|gulasch/.test(combinedText)) {
        return RECIPE_THEME_COLORS.BEEF;
      }
      if (/hähnchen|huhn|hühner|pute|puten|geflügel|frikassee/.test(combinedText)) {
        return RECIPE_THEME_COLORS.POULTRY;
      }
      return RECIPE_THEME_COLORS.VEGGIE;
    };

    const BASE_SIGNATURE_RECIPES = [
      {
        id: 'rec-1',
        title: 'Hähnchen-Frikassee',
        subtitle: 'Mit Basmatireis, süßlichen Erbsen & Möhren in leichter Frischkäse-Soße',
        emoji: '🍚',
        accentColor: RECIPE_THEME_COLORS.POULTRY,
        prepTimeActive: 15,
        prepTimePassive: 15,
        effortLevel: 'Minimal (TK-Gemüse)',
        fridgeDays: 4,
        freezerMonths: 3,
        toddlerNote: 'Weiche Textur, mild-süßlich',
        calories: 510,
        protein: 44,
        carbs: 58,
        fat: 9,
        basePortions: 4,
        ingredients: [
          { name: 'Basmati- oder Parboiled-Reis (ungekocht)', amount: 250, unit: 'g', category: 'Vorratsschrank' },
          { name: 'Hähnchenbrustfilet (klein gewürfelt)', amount: 600, unit: 'g', category: 'Fleisch & Frische' },
          { name: 'TK-Erbsen und Möhren', amount: 400, unit: 'g', category: 'Tiefkühlung' },
          { name: 'Fettarme Milch (1,5%)', amount: 250, unit: 'ml', category: 'Kühlregal' },
          { name: 'Milde Hühner- oder Gemüsebrühe', amount: 250, unit: 'ml', category: 'Vorratsschrank' },
          { name: 'Frischkäse Light (0,2% Fett)', amount: 100, unit: 'g', category: 'Kühlregal' },
          { name: 'Rapsöl zum Anbraten', amount: 1, unit: 'EL', category: 'Vorratsschrank' },
          { name: 'Zitronensaft & Prise Muskatnuss', amount: 1, unit: 'Spritzer', category: 'Vorratsschrank' }
        ],
        steps: [
          'Den Basmati- oder Parboiled-Reis in einem Sieb kalt abspülen und nach Packungsanweisung in leicht gesalzenem Wasser bei schwacher Hitze ca. 12–15 Minuten locker garen.',
          'Währenddessen das Hähnchenbrustfilet trocken tupfen und in kleine, mundgerechte Würfel (ca. 2 cm) schneiden.',
          'Das Rapsöl in einer großen, tiefen Pfanne erhitzen und die Hähnchenwürfel darin bei mittlerer bis hoher Hitze rundherum 4–5 Minuten goldbraun anbraten.',
          'Mit der milden Brühe und der fettarmen Milch ablöschen, die tiefgekühlten Erbsen und Möhren direkt dazugeben und alles abgedeckt 10–12 Minuten sanft köcheln lassen, bis das Gemüse weich ist.',
          'Die Pfanne auf niedrige Stufe schalten, den Frischkäse Light mit einem Schneebesen glatt einrühren und die Soße mit einem Spritzer Zitronensaft sowie einer Prise Muskatnuss mild abschmecken.',
          'Den gegarten Reis unter das cremige Hähnchen-Frikassee heben oder direkt zusammen anrichten.'
        ]
      }
    ];

    const buildStandalone50Recipes = () => {
      if (Array.isArray(window.MEALMATE_RECIPES) && window.MEALMATE_RECIPES.length > 0) {
        return window.MEALMATE_RECIPES;
      }
      return BASE_SIGNATURE_RECIPES;
    };

    const ALL_RECIPES = buildStandalone50Recipes();

    // ============================================================================
    // DOMÄNEN-FUNKTIONEN
    // ============================================================================
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const extractConciseTitleAndSubtitle = (rawTitle = '', rawSubtitle = '') => {
      let title = String(rawTitle || '').trim();
      let subtitle = String(rawSubtitle || '').trim();

      if (title.length > 34) {
        const splitRegex = /\s+(?:dazu|mit|auf|an|in)\s+/i;
        const match = title.match(splitRegex);
        if (match && match.index >= 8) {
          const coreTitle = title.slice(0, match.index).trim();
          const sideInfo = title.slice(match.index).trim();
          title = coreTitle;
          if (!subtitle.toLowerCase().includes(sideInfo.toLowerCase())) {
            const capitalizedSide = sideInfo.charAt(0).toUpperCase() + sideInfo.slice(1);
            subtitle = subtitle ? `${capitalizedSide} • ${subtitle}` : capitalizedSide;
          }
        }
      }
      return { title, subtitle };
    };

    const getDayPortions = (item) => {
      if (!item) return {};
      if (item.dayPortions && typeof item.dayPortions === 'object') return item.dayPortions;
      if (item.weekday) return { [item.weekday]: item.portions || APP_CONFIG.DEFAULT_BASE_PORTIONS };
      return {};
    };

    const getTotalPortions = (item) => {
      if (!item) return APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const dp = getDayPortions(item);
      const days = Object.keys(dp);
      if (days.length > 0) return days.reduce((sum, day) => sum + (Number(dp[day]) || 0), 0);
      return item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
    };

    const formatDaySchedule = (item) => {
      const dp = getDayPortions(item);
      return WEEKDAYS.filter((d) => (dp[d.short] || 0) > 0)
        .map((d) => `${d.short}: ${dp[d.short]}P`)
        .join(', ');
    };

    const applyWeekdayToggle = (item, dayShort, defaultPortions = APP_CONFIG.DEFAULT_DAY_PORTIONS) => {
      const currentDp = { ...getDayPortions(item) };
      if (currentDp[dayShort]) delete currentDp[dayShort];
      else currentDp[dayShort] = defaultPortions;
      
      const remainingDays = WEEKDAYS.map((d) => d.short).filter((d) => currentDp[d] > 0);
      const nextTotal = remainingDays.length > 0 ? remainingDays.reduce((sum, d) => sum + currentDp[d], 0) : item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
      return { ...item, dayPortions: currentDp, portions: nextTotal, weekday: remainingDays[0] || null };
    };

    const applyDayPortionDelta = (item, dayShort, delta) => {
      const currentDp = { ...getDayPortions(item) };
      const currentVal = currentDp[dayShort] || APP_CONFIG.DEFAULT_DAY_PORTIONS;
      currentDp[dayShort] = clamp(currentVal + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_DAY_PORTIONS);
      const nextTotal = Object.values(currentDp).reduce((sum, v) => sum + v, 0);
      return { ...item, dayPortions: currentDp, portions: nextTotal };
    };

    const applyBasePortionDelta = (item, delta) => {
      const currentPortions = item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const nextPortions = clamp(currentPortions + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_TOTAL_PORTIONS);
      return { ...item, portions: nextPortions };
    };

    const CATEGORY_ORDER = [
      { key: 'Obst & Gemüse', icon: '🥦', badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' },
      { key: 'Fleisch & Frische', icon: '🍗', badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30' },
      { key: 'Kühlregal', icon: '🥛', badge: 'bg-sky-500/15 text-sky-300 border-sky-500/30' },
      { key: 'Tiefkühlung', icon: '❄️', badge: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
      { key: 'Vorratsschrank', icon: '🥫', badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30' }
    ];

    const normalizeIngredientName = (rawName = '') =>
      rawName
        .replace(/\([^)]*\)/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

    const aggregateShoppingList = (planRecipes) => {
      const map = {};
      const validCategories = new Set(CATEGORY_ORDER.map((c) => c.key));
      (planRecipes || []).forEach((item) => {
        const { recipe } = item;
        if (!recipe || !Array.isArray(recipe.ingredients)) return;
        const totalPortions = getTotalPortions(item);
        const scheduleLabel = formatDaySchedule(item);
        const basePortions = recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
        const scale = totalPortions / basePortions;
        const { title: shortRecipeTitle } = extractConciseTitleAndSubtitle(recipe.title, recipe.subtitle);

        recipe.ingredients.forEach((ing) => {
          const normCategory = validCategories.has(ing.category) ? ing.category : 'Vorratsschrank';
          const baseName = normalizeIngredientName(ing.name);
          const cleanDisplayName = ing.name.replace(/\([^)]*\)/g, '').trim() || ing.name;
          const key = `${normCategory}__${baseName}__${ing.unit.toLowerCase().trim()}`;

          if (!map[key]) {
            map[key] = { id: key, name: cleanDisplayName, unit: ing.unit, category: normCategory, amount: 0, sources: [] };
          }
          map[key].amount += ing.amount * scale;
          const sourceLabel = scheduleLabel ? `${shortRecipeTitle} (${scheduleLabel})` : `${shortRecipeTitle} (${totalPortions}P)`;
          if (!map[key].sources.includes(sourceLabel)) map[key].sources.push(sourceLabel);
        });
      });
      const grouped = {};
      CATEGORY_ORDER.forEach((cat) => { grouped[cat.key] = []; });
      Object.values(map).forEach((entry) => {
        const roundedAmount = entry.amount >= 10 ? Math.round(entry.amount) : Math.round(entry.amount * 10) / 10;
        grouped[entry.category].push({ ...entry, amount: roundedAmount });
      });
      return grouped;
    };

    const calculatePlanStats = (planItems) => {
      const targetList = planItems || [];
      if (targetList.length === 0) return { totalPortions: 0, avgCalories: 0, avgProtein: 0 };
      let totalPortions = 0, weightedCal = 0, weightedProt = 0;
      targetList.forEach((item) => {
        const portions = getTotalPortions(item);
        totalPortions += portions;
        weightedCal += (item.recipe?.calories || 0) * portions;
        weightedProt += (item.recipe?.protein || 0) * portions;
      });
      return {
        totalPortions,
        avgCalories: totalPortions > 0 ? Math.round(weightedCal / totalPortions) : 0,
        avgProtein: totalPortions > 0 ? Math.round(weightedProt / totalPortions) : 0
      };
    };

    const formatShoppingListText = (planName = 'Wochenplan', planRecipes = [], aggregatedShoppingList = {}, checkedItems = {}) => {
      const lines = [`🛒 MEALMATE EINKAUFSLISTE – ${planName.toUpperCase()}`, ''];
      if (planRecipes.length > 0) {
        lines.push('Geplante Gerichte:');
        planRecipes.forEach((item) => {
          const schedule = formatDaySchedule(item);
          const { title: shortTitle } = extractConciseTitleAndSubtitle(item.recipe?.title, item.recipe?.subtitle);
          lines.push(`- ${shortTitle}: ${getTotalPortions(item)} Portionen${schedule ? ` (${schedule})` : ''}`);
        });
        lines.push('');
      }
      CATEGORY_ORDER.forEach(({ key, icon }) => {
        const items = aggregatedShoppingList[key] || [];
        if (items.length === 0) return;
        lines.push(`${icon} ${key.toUpperCase()}`);
        items.forEach((item) => { lines.push(`${checkedItems[item.id] ? '[x]' : '[ ]'} ${item.amount} ${item.unit} ${item.name}`); });
        lines.push('');
      });
      return lines.join('\n').trim();
    };

    const coercePositiveNumber = (val, fallback, min = 0, max = 10000) => {
      const num = typeof val === 'number' ? val : Number(String(val ?? '').replace(',', '.'));
      if (!Number.isFinite(num)) return fallback;
      return clamp(num, min, max);
    };

    const coerceNonEmptyString = (val, fallback) => {
      if (typeof val === 'string' && val.trim().length > 0) return val.trim();
      return fallback;
    };

    const validateAndSanitizeRecipe = (raw, fallbackIdPrefix = 'rec-validated', index = 0) => {
      if (!raw || typeof raw !== 'object') return { valid: false, recipe: null };
      const rawTitle = coerceNonEmptyString(raw.title, '');
      if (!rawTitle) return { valid: false, recipe: null };
      const rawSubtitle = coerceNonEmptyString(raw.subtitle, 'Leckeres Familien-Rezept');
      const { title, subtitle } = extractConciseTitleAndSubtitle(rawTitle, rawSubtitle);
      
      const rawIngredients = Array.isArray(raw.ingredients) ? raw.ingredients : [];
      const sanitizedIngredients = rawIngredients.length > 0 ? rawIngredients.map((ing, idx) => ({
        name: coerceNonEmptyString(ing.name, `Zutat ${idx + 1}`),
        amount: coercePositiveNumber(ing.amount, 100, 0.1, 5000),
        unit: coerceNonEmptyString(ing.unit, 'g'),
        category: CATEGORY_ORDER.some(c => c.key === ing.category) ? ing.category : 'Vorratsschrank'
      })) : [{ name: 'Hauptzutat', amount: 400, unit: 'g', category: 'Fleisch & Frische' }];

      const rawSteps = Array.isArray(raw.steps) ? raw.steps.map((s) => coerceNonEmptyString(s, '')).filter(Boolean) : [];
      const shortStamp = String(Date.now()).slice(-4);
      
      return {
        valid: true,
        recipe: {
          id: coerceNonEmptyString(raw.id, `${fallbackIdPrefix}-${shortStamp}-${index + 1}`),
          title,
          subtitle,
          emoji: coerceNonEmptyString(raw.emoji, '🍲'),
          accentColor: determineSemanticRecipeColor(title, sanitizedIngredients),
          prepTimeActive: Math.round(coercePositiveNumber(raw.prepTimeActive, 15, 5, 120)),
          prepTimePassive: Math.round(coercePositiveNumber(raw.prepTimePassive, 20, 0, 240)),
          effortLevel: coerceNonEmptyString(raw.effortLevel, 'Gering'),
          fridgeDays: Math.round(coercePositiveNumber(raw.fridgeDays, 3, 1, 7)),
          freezerMonths: Math.round(coercePositiveNumber(raw.freezerMonths, 2, 0, 12)),
          toddlerNote: coerceNonEmptyString(raw.toddlerNote, 'Mild gewürzt'),
          calories: Math.round(coercePositiveNumber(raw.calories, 500, 150, 1500)),
          protein: Math.round(coercePositiveNumber(raw.protein, 40, 5, 150)),
          carbs: Math.round(coercePositiveNumber(raw.carbs, 50, 0, 250)),
          fat: Math.round(coercePositiveNumber(raw.fat, 12, 1, 100)),
          basePortions: Math.round(coercePositiveNumber(raw.basePortions, APP_CONFIG.DEFAULT_BASE_PORTIONS, 1, 12)),
          ingredients: sanitizedIngredients,
          steps: rawSteps.length > 0 ? rawSteps : ['Zutaten vorbereiten und kochen.']
        }
      };
    };

    const mergeRecipesIntoDatabase = (currentDatabase = [], incomingRecipes = []) => {
      const updatedDb = [...currentDatabase];
      const seenIds = new Set(updatedDb.map((r) => r?.id).filter(Boolean));
      (incomingRecipes || []).forEach((recipe, idx) => {
        if (!recipe || !recipe.title) return;
        const ensuredId = recipe.id || `db-rec-${Date.now()}-${idx}`;
        if (!seenIds.has(ensuredId)) {
          seenIds.add(ensuredId);
          updatedDb.push(recipe);
        }
      });
      return updatedDb;
    };

    const pickRandomRecipe = (database = [], excludeId = null, rng = Math.random) => {
      if (!Array.isArray(database) || database.length === 0) return null;
      if (database.length === 1) return database[0];
      const candidates = excludeId ? database.filter((r) => r?.id !== excludeId) : database;
      const pool = candidates.length > 0 ? candidates : database;
      return pool[Math.floor(rng() * pool.length)];
    };

    // ============================================================================
    // OFFLINE CACHE & HOOKS
    // ============================================================================
    const OfflineCacheEngine = (() => {
      const memoryFallback = {};
      const openDb = () => new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB nicht verfügbar')); return; }
        const req = window.indexedDB.open(APP_CONFIG.IDB_NAME, APP_CONFIG.IDB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains('kvStore')) e.target.result.createObjectStore('kvStore');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      const getSyncItem = (key, defaultVal) => {
        try { const raw = window.localStorage.getItem(`mealmate_${key}`); if (raw) return JSON.parse(raw); } catch {}
        return memoryFallback[key] ?? defaultVal;
      };

      const getItem = async (key, defaultVal) => {
        const syncVal = getSyncItem(key, undefined);
        if (syncVal !== undefined) return syncVal;
        try {
          const idb = await openDb();
          const val = await new Promise((resolve) => {
            const req = idb.transaction('kvStore', 'readonly').objectStore('kvStore').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(undefined);
          });
          if (val !== undefined) return val;
        } catch {}
        return defaultVal;
      };

      const setItem = async (key, value) => {
        memoryFallback[key] = value;
        try { window.localStorage.setItem(`mealmate_${key}`, JSON.stringify(value)); } catch {}
        try {
          const idb = await openDb();
          await new Promise((resolve) => {
            const tx = idb.transaction('kvStore', 'readwrite');
            tx.objectStore('kvStore').put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch {}
      };
      return { getSyncItem, getItem, setItem };
    })();

    function usePersistedState(storageKey, defaultValue) {
      const [state, setState] = useState(() => OfflineCacheEngine.getSyncItem(storageKey, defaultValue));

      useEffect(() => {
        let isMounted = true;
        OfflineCacheEngine.getItem(storageKey, undefined).then((asyncVal) => {
          if (isMounted && asyncVal !== undefined) {
            setState((prev) => (Array.isArray(prev) && prev.length === 0 ? asyncVal : prev));
          }
        });
        return () => { isMounted = false; };
      }, [storageKey]);

      useEffect(() => {
        OfflineCacheEngine.setItem(storageKey, state);
      }, [storageKey, state]);

      return [state, setState];
    }

    // ============================================================================
    // API CALLS
    // ============================================================================
    async function callGeminiRecipeAgent(userInstruction, currentRecipeContext, userApiKey) {
      if (!userApiKey) throw new Error('Kein API Key');
      const apiUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
      const promptText = currentRecipeContext
        ? `Wandle dieses Familien-Meal-Prep-Rezept nach folgendem Wunsch ab: "${userInstruction}". Bestehendes Rezept: ${JSON.stringify(currentRecipeContext)}. Behalte 4 Portionen und mindestens 35g Protein bei.`
        : `Erstelle ein neues Familien-Meal-Prep-Rezept (4 Portionen, mind. 35g Protein): "${userInstruction}".`;
      
      const payload = {
        systemInstruction: {
          parts: [{ text: 'Du bist ein erfahrener Koch und Familien-Meal-Prep-Assistent. Erstelle milde, kindgerechte Rezepte für 4 Portionen mit mindestens 35g Protein pro Portion.' }]
        },
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              title: { type: 'STRING' },
              subtitle: { type: 'STRING' },
              emoji: { type: 'STRING' },
              prepTimeActive: { type: 'INTEGER' },
              prepTimePassive: { type: 'INTEGER' },
              effortLevel: { type: 'STRING' },
              fridgeDays: { type: 'INTEGER' },
              freezerMonths: { type: 'INTEGER' },
              toddlerNote: { type: 'STRING' },
              calories: { type: 'INTEGER' },
              protein: { type: 'INTEGER' },
              carbs: { type: 'INTEGER' },
              fat: { type: 'INTEGER' },
              ingredients: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: {
                    name: { type: 'STRING' },
                    amount: { type: 'NUMBER' },
                    unit: { type: 'STRING' },
                    category: { type: 'STRING' }
                  }
                }
              },
              steps: { type: 'ARRAY', items: { type: 'STRING' } }
            }
          }
        }
      };
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': userApiKey.trim()
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rawParsed = JSON.parse((await response.json())?.candidates?.[0]?.content?.parts?.[0]?.text);
      const baseId = currentRecipeContext?.id ? `${currentRecipeContext.id}-ki` : `ki-${String(Date.now()).slice(-4)}`;
      const { valid, recipe } = validateAndSanitizeRecipe({ ...rawParsed, id: baseId }, 'ki');
      if (!valid) throw new Error('Formatfehler');
      return recipe;
    }

    function applyLocalRecipeVariation(recipe, instructionText) {
      const lower = (instructionText || '').toLowerCase();
      const cloned = structuredClone(recipe);
      cloned.id = `${recipe.id || 'rec'}-umbau`;

      const { title: baseShortTitle, subtitle: baseSub } = extractConciseTitleAndSubtitle(recipe.title, recipe.subtitle);
      cloned.title = baseShortTitle;
      cloned.subtitle = baseSub;

      if (lower.includes('reis')) {
        cloned.subtitle = `Mit lockerem Basmatireis • ${baseSub}`;
        cloned.ingredients = cloned.ingredients.map((ing) =>
          /kartoffel|nudel|gnocchi|spätzle|penne/i.test(ing.name)
            ? { name: 'Basmatireis (ungekocht)', amount: 260, unit: 'g', category: 'Vorratsschrank' }
            : ing
        );
      } else if (lower.includes('vegetarisch') || lower.includes('quark') || lower.includes('hüttenkäse')) {
        cloned.title = baseShortTitle.replace(/Hähnchen|Puten|Rinder|Lachs|Hackfleisch/gi, 'Veggie').replace(/--+/g, '-');
        if (cloned.title === baseShortTitle) cloned.title = `${baseShortTitle} (Veggie)`;
        cloned.subtitle = `Vegetarischer High-Protein-Mix • ${baseSub}`;
        cloned.emoji = '🌱';
        cloned.ingredients = cloned.ingredients.map((ing) =>
          ing.category === 'Fleisch & Frische'
            ? { name: 'Körniger Frischkäse & Rote Linsen Mix', amount: 480, unit: 'g', category: 'Kühlregal' }
            : ing
        );
      } else {
        cloned.subtitle = `${instructionText} • ${baseSub}`;
        cloned.prepTimeActive = Math.max(10, (cloned.prepTimeActive || 15) - 5);
        cloned.effortLevel = 'Minimal (TK-Optimiert)';
      }
      cloned.accentColor = determineSemanticRecipeColor(cloned.title, cloned.ingredients);
      return cloned;
    }

        { id: 'veg', label: '🌱 Veggie' },
        { id: 'fish', label: '🐟 Fisch' },
        { id: 'fast', label: '⏱️ < 15 Min' }
      ];

      const toggleFilter = (id) => setActiveFilters(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);

      const results = useMemo(() => {
        return database.filter(recipe => {
          if (searchTerm) {
            const term = searchTerm.toLowerCase();
            const matchesText = recipe.title.toLowerCase().includes(term) ||
                                (recipe.subtitle || '').toLowerCase().includes(term) ||
                                recipe.ingredients.some(i => i.name.toLowerCase().includes(term));
            if (!matchesText) return false;
          }
          if (activeFilters.includes('fav') && !favorites.some(f => f.id === recipe.id)) return false;
          if (activeFilters.includes('veg') && recipe.accentColor !== RECIPE_THEME_COLORS.VEGGIE) return false;
          if (activeFilters.includes('fish') && recipe.accentColor !== RECIPE_THEME_COLORS.FISH) return false;
          if (activeFilters.includes('fast') && recipe.prepTimeActive > 15) return false;
          return true;
        });
      }, [database, favorites, searchTerm, activeFilters]);

      if (!isOpen) return null;

      const handleImgError = (id) => {
        setImgErrors(prev => ({ ...prev, [id]: true }));
      };

      return html`
        <div className="fixed inset-0 z-50 bg-[#0B132B] flex flex-col ios-safe-container">
          <div className="flex items-center gap-3 p-4 border-b border-slate-800 bg-slate-950/95 shrink-0">
            <button onClick=${onClose} className="p-2 rounded-full bg-slate-900 text-slate-400 hover:text-white transition"><${Icons.ArrowLeft} className="w-5 h-5" /></button>
            <div className="flex-1 relative">
              <${Icons.Search} className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
              <input type="text" value=${searchTerm} onChange=${(e) => setSearchTerm(e.target.value)} placeholder="Rezepte, Zutaten suchen..." className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
            </div>
          </div>
          <div className="flex gap-2 p-3 overflow-x-auto ios-scroll border-b border-slate-800 shrink-0 bg-slate-950/50">
            ${FILTERS.map(f => {
              const active = activeFilters.includes(f.id);
              return html`<button key=${f.id} onClick=${() => toggleFilter(f.id)} className=${`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${active ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-700'}`}>${f.label}</button>`;
            })}
          </div>
          <div className="flex-1 overflow-y-auto ios-scroll p-4 space-y-3 bg-[#0B132B]">
            ${results.length === 0 ? html`<div className="text-center text-slate-500 text-sm mt-10 font-medium">Keine Rezepte gefunden.</div>` : ''}
            ${results.map(recipe => {
              const { title: shortTitle, subtitle: shortSub } = extractConciseTitleAndSubtitle(recipe.title, recipe.subtitle);
              const isFav = favorites.some(f => f.id === recipe.id);
              const isSaved = savedRecipes.some(s => s.recipe.id === recipe.id);
              const hasImgError = imgErrors[recipe.id];
              return html`
                <div key=${recipe.id} className="flex items-center justify-between bg-slate-900/80 p-3 rounded-2xl border border-slate-800 transition hover:border-slate-700">
                  <div className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onClick=${() => onPreview(recipe)}>
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0 bg-slate-950 border border-slate-800/80 overflow-hidden">
                      ${!hasImgError ? html`
                        <img 
                          src=${`img/${recipe.id}.jpg`} 
                          alt=${shortTitle} 
                          onError=${() => handleImgError(recipe.id)} 
                          className="w-full h-full object-cover" 
                        />
                      ` : recipe.emoji}
                    </div>
                    <div className="min-w-0 flex-1">
                      <h4 className="text-sm font-extrabold text-white truncate">${shortTitle}</h4>
                      <p className="text-[10px] text-slate-400 truncate">${shortSub}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <span className="text-[9px] font-bold text-slate-500 flex items-center gap-0.5"><${Icons.Clock} className="w-2.5 h-2.5"/> ${recipe.prepTimeActive} Min.</span>
                        <span className="text-[9px] font-bold text-emerald-400">${recipe.protein}g Protein</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0 ml-2">
                    <button onClick=${() => onToggleFavorite(recipe)} className="p-2 rounded-full bg-slate-950 text-slate-400 transition hover:text-amber-400 border border-slate-800">
                       <${Icons.Star} className=${`w-4 h-4 ${isFav ? 'fill-amber-400 text-amber-400' : ''}`} />
                    </button>
                    <button onClick=${() => onBookmark(recipe)} disabled=${isSaved} className=${`px-2.5 py-1.5 rounded-xl text-xs font-bold transition ${isSaved ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-cyan-500 text-slate-950 shadow-sm'}`}>
                       ${isSaved ? '✓ Plan' : '+ Merken'}
                    </button>
                  </div>
                </div>
              `;
            })}
          </div>
        </div>
      `;
    }

    // ============================================================================
    // HAUPTKOMPONENTE (APP)
    // ============================================================================
    function App() {
      const [setupModalOpen, setSetupModalOpen] = useState(false);
      const [userApiKey, setUserApiKey] = usePersistedState('geminiApiKey', '');
      
      const [recipeDatabase, setRecipeDatabase] = useState(() => {
        const cached = OfflineCacheEngine.getSyncItem('recipes', []);
        return cached.length > 0 ? mergeRecipesIntoDatabase(ALL_RECIPES, cached) : ALL_RECIPES;
      });
      const [currentCard, setCurrentCard] = useState(() => pickRandomRecipe(ALL_RECIPES));
      const [currentCardImgError, setCurrentCardImgError] = useState(false);
      
      const [savedRecipes, setSavedRecipes] = usePersistedState('mealPlans', []);
      const [weeklyPlans, setWeeklyPlans] = usePersistedState('weeklyPlans', []);
      const [favorites, setFavorites] = usePersistedState('favorites', []);
      const [searchModalOpen, setSearchModalOpen] = useState(false);

      const [newPlanName, setNewPlanName] = useState('');
      const [selectedPlanId, setSelectedPlanId] = useState(null);
      const [planSubView, setPlanSubView] = useState('schedule');
      const [planDayFilter, setPlanDayFilter] = useState('Alle');
      const [cookingModalItem, setCookingModalItem] = useState(null);

      const [activeView, setActiveView] = useState('swipe');
      const [cardTab, setCardTab] = useState('ingredients');
      const [weekdayFilter, setWeekdayFilter] = useState('Alle');

      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [swipeFeedback, setSwipeFeedback] = useState(null);
      const startXRef = useRef(0);
      const [aiInput, setAiInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiStatusMessage, setAiStatusMessage] = useState('');

      useEffect(() => {
        (async () => {
          const cachedCustom = await OfflineCacheEngine.getItem('recipes', []);
          if (cachedCustom.length > 0) {
            setRecipeDatabase((prev) => mergeRecipesIntoDatabase(prev, cachedCustom));
          }
        })();
      }, []);

      const showTemporaryStatus = useCallback((message) => {
        setAiStatusMessage(message);
        setTimeout(() => setAiStatusMessage(''), APP_CONFIG.TOAST_DURATION_MS);
      }, []);

      const handleSaveApiKey = (newKey) => {
        setUserApiKey(newKey);
        showTemporaryStatus(newKey ? 'API-Key gespeichert!' : 'Offline-Modus aktiv!');
      };

      const toggleFavorite = useCallback((recipe) => {
        setFavorites(prev => {
          if (prev.some(f => f.id === recipe.id)) return prev.filter(f => f.id !== recipe.id);
          return [...prev, recipe];
        });
      }, [setFavorites]);

      const handleBookmarkFromSearch = useCallback((recipe) => {
        setSavedRecipes(prev => {
          if (prev.some((item) => item.recipe.id === recipe.id)) return prev;
          return [...prev, { recipe, portions: recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS, dayPortions: {} }];
        });
        showTemporaryStatus(`"${extractConciseTitleAndSubtitle(recipe.title, '').title}" gemerkt!`);
      }, [setSavedRecipes, showTemporaryStatus]);

      const addRecipesToDatabaseWithPersistence = useCallback((newRecipes) => {
        let updatedDb = [];
        setRecipeDatabase((prev) => {
          const merged = mergeRecipesIntoDatabase(prev, newRecipes);
          updatedDb = merged;
          OfflineCacheEngine.setItem('recipes', merged.filter((r) => !ALL_RECIPES.some((b) => b.id === r.id)));
          return merged;
        });
        return updatedDb;
      }, []);

      const triggerDecision = (decision) => {
        if (!currentCard || isGenerating) return;
        setSwipeFeedback(decision);
        setTimeout(() => {
          if (decision === 'like') {
            setSavedRecipes((prev) => {
              if (prev.some((item) => item.recipe.id === currentCard.id)) return prev;
              return [...prev, { recipe: currentCard, portions: currentCard.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS, dayPortions: {} }];
            });
          }
          setDragX(0);
          setSwipeFeedback(null);
          setCardTab('ingredients');
          setCurrentCardImgError(false);
          setCurrentCard((prevCard) => pickRandomRecipe(recipeDatabase, prevCard?.id));
        }, APP_CONFIG.SWIPE_ANIMATION_MS);
      };

      const handlePointerDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.no-drag')) return;
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        }
        setIsDragging(true);
        startXRef.current = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
      };
      
      const handlePointerMove = (e) => {
        if (!isDragging) return;
        setDragX((e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0) - startXRef.current);
      };

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        if (e && e.currentTarget && e.currentTarget.releasePointerCapture) {
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
        }
        setIsDragging(false);
        if (dragX > APP_CONFIG.SWIPE_THRESHOLD_PX) triggerDecision('like');
        else if (dragX < -APP_CONFIG.SWIPE_THRESHOLD_PX) triggerDecision('nope');
        else setDragX(0);
      };

      const handleModifyCurrentRecipe = async (instructionText) => {
        const query = instructionText || aiInput.trim();
        if (!query || !currentCard || isGenerating) return;
        setIsGenerating(true);
        setAiStatusMessage(`Rezept wird angepasst...`);
        try {
          let newRecipe;
          if (userApiKey) {
            newRecipe = await callGeminiRecipeAgent(query, currentCard, userApiKey);
          } else {
            newRecipe = applyLocalRecipeVariation(currentCard, query);
          }
          const updatedDb = addRecipesToDatabaseWithPersistence([newRecipe]);
          const insertedRecipe = updatedDb.find((r) => r.id === newRecipe.id) || newRecipe;
          setCurrentCard(insertedRecipe);
          setAiInput(''); setCardTab('ingredients');
          showTemporaryStatus(userApiKey ? 'Rezept per KI angepasst!' : 'Rezept lokal angepasst (Offline-Modus)!');
        } catch {
          const fallbackRecipe = applyLocalRecipeVariation(currentCard, query);
          const updatedDb = addRecipesToDatabaseWithPersistence([fallbackRecipe]);
          const insertedRecipe = updatedDb.find((r) => r.id === fallbackRecipe.id) || fallbackRecipe;
          setCurrentCard(insertedRecipe);
          setAiInput(''); setCardTab('ingredients');
          showTemporaryStatus('Rezept mit lokalem Baukasten angepasst!');
        } finally { setIsGenerating(false); }
      };

      const handleSaveWeeklyPlan = () => {
        if (savedRecipes.length === 0) return;
        const defaultName = `Wochenplan #${weeklyPlans.length + 1} (${new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })})`;
        const finalName = newPlanName.trim() || defaultName;
        const newPlanId = `plan-${Date.now()}`;

        const clonedItems = structuredClone(savedRecipes);
        const newPlan = {
          id: newPlanId,
          name: finalName,
          createdAt: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }),
          items: clonedItems,
          checkedItems: {}
        };

        setWeeklyPlans((prev) => [newPlan, ...prev]);
        setNewPlanName('');
        setSavedRecipes([]);
        setSelectedPlanId(newPlanId);
        setPlanSubView('schedule');
        setPlanDayFilter('Alle');
        setActiveView('myprep');
        showTemporaryStatus(`Wochenplan „${finalName}“ gespeichert & Merkliste geleert!`);
      };

      const handleDeleteWeeklyPlan = (planId, e) => {
        if (e) e.stopPropagation();
        setWeeklyPlans((prev) => prev.filter((p) => p.id !== planId));
        if (selectedPlanId === planId) setSelectedPlanId(null);
        showTemporaryStatus('Wochenplan gelöscht.');
      };

      const handleTogglePlanShoppingItem = (planId, itemId) => {
        setWeeklyPlans((prev) =>
          prev.map((plan) => {
            if (plan.id !== planId) return plan;
            const currentChecked = plan.checkedItems || {};
            return {
              ...plan,
              checkedItems: {
                ...currentChecked,
                [itemId]: !currentChecked[itemId]
              }
            };
          })
        );
      };

      const selectedPlan = useMemo(
        () => weeklyPlans.find((p) => p.id === selectedPlanId) || null,
        [weeklyPlans, selectedPlanId]
      );

      const selectedPlanShoppingList = useMemo(
        () => (selectedPlan ? aggregateShoppingList(selectedPlan.items) : {}),
        [selectedPlan]
      );

      const selectedPlanStats = useMemo(
        () => (selectedPlan ? calculatePlanStats(selectedPlan.items) : { totalPortions: 0, avgCalories: 0, avgProtein: 0 }),
        [selectedPlan]
      );

      const savedListStats = useMemo(
        () => calculatePlanStats(savedRecipes),
        [savedRecipes]
      );

      const handleCopyPlanShoppingList = async () => {
        if (!selectedPlan) return;
        const text = formatShoppingListText(
          selectedPlan.name,
          selectedPlan.items,
          selectedPlanShoppingList,
          selectedPlan.checkedItems || {}
        );
        if (navigator.share) {
          try {
            await navigator.share({ title: `Einkaufsliste – ${selectedPlan.name}`, text });
            return;
          } catch {}
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            showTemporaryStatus('Einkaufsliste in die Zwischenablage kopiert!');
            return;
          }
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showTemporaryStatus('Einkaufsliste in die Zwischenablage kopiert!');
        } catch {
          showTemporaryStatus('Kopieren fehlgeschlagen.');
        }
      };

      const rotation = (dragX / APP_CONFIG.SWIPE_ROTATION_DIVISOR).toFixed(2);
      const likeOpacity = clamp(dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);
      const nopeOpacity = clamp(-dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);
      const currentCardDisplay = currentCard ? extractConciseTitleAndSubtitle(currentCard.title, currentCard.subtitle) : { title: '', subtitle: '' };

      return html`
        <div className="min-h-screen bg-[#0B132B] text-slate-100 flex flex-col items-center justify-start ios-safe-container relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>
          
          <${SetupModal} isOpen=${setupModalOpen} onClose=${() => setSetupModalOpen(false)} apiKey=${userApiKey} onSaveApiKey=${handleSaveApiKey} />
          <${SearchModal} isOpen=${searchModalOpen} onClose=${() => setSearchModalOpen(false)} database=${recipeDatabase} favorites=${favorites} onToggleFavorite=${toggleFavorite} savedRecipes=${savedRecipes} onBookmark=${handleBookmarkFromSearch} onPreview=${(recipe) => setCookingModalItem({ recipe, portions: recipe.basePortions, dayPortions: {} })} />
          <${CookRecipeModal} item=${cookingModalItem} onClose=${() => setCookingModalItem(null)} />

          <div className="w-full max-w-[430px] flex flex-col min-h-[92vh] bg-slate-900/80 border border-slate-700/50 rounded-[32px] shadow-2xl overflow-hidden relative backdrop-blur-2xl z-10">
            
            <header className="px-4 pt-4 pb-3 border-b border-cyan-900/50 bg-slate-950/95 sticky top-0 z-30">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <h1 className="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
                    <span>Meal<span className="text-orange-400">Mate</span></span>
                  </h1>
                  <p className="text-[11px] text-cyan-400/80 flex items-center gap-1">
                    <span>Gesundes Vorkochen für Familien</span>
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  <button onClick=${() => setSearchModalOpen(true)} className="px-2.5 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/50 text-slate-300 hover:text-white transition shadow-sm"><${Icons.Search} className="w-3.5 h-3.5" /></button>
                  <button onClick=${() => setSetupModalOpen(true)} className="px-2.5 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-500/25 transition"><${Icons.Smartphone} className="w-3.5 h-3.5" /></button>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-1 p-1 bg-slate-950/90 rounded-2xl border border-slate-800/80 text-xs font-semibold">
                <button onClick=${() => setActiveView('swipe')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'swipe' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Layers} className="w-3.5 h-3.5" /><span>Karten</span></button>
                <button onClick=${() => setActiveView('saved')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'saved' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Bookmark} className="w-3.5 h-3.5" /><span>Merkliste (${savedRecipes.length})</span></button>
                <button onClick=${() => setActiveView('myprep')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'myprep' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Calendar} className="w-3.5 h-3.5" /><span>MyPrep (${weeklyPlans.length})</span></button>
              </div>
            </header>

            ${aiStatusMessage ? html`
              <div className="mx-4 mt-2 px-3.5 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-medium flex items-center gap-2 z-30">
                ${isGenerating ? html`<${Icons.RefreshCw} className="w-3.5 h-3.5 animate-spin shrink-0" />` : html`<${Icons.CheckCircle2} className="w-3.5 h-3.5 shrink-0" />`}
                <span>${aiStatusMessage}</span>
              </div>
            ` : ''}

            ${activeView === 'swipe' ? html`
              <main className="flex-1 flex flex-col justify-between p-3.5 overflow-hidden">
                <div className="flex items-center justify-between px-3 py-1.5 mb-2 rounded-2xl bg-slate-950/80 border border-slate-800/90 text-[11px]">
                  <div className="flex items-center gap-1.5 text-slate-300 font-semibold"><${Icons.Database} className="w-3.5 h-3.5 text-cyan-400" /><span>Datenbank: <strong className="text-white">${recipeDatabase.length}</strong> Rezepte</span></div>
                  ${currentCard ? html`
                    <span className="text-slate-500 font-mono font-bold tracking-wider">ID: ${currentCard.id}</span>
                  ` : ''}
                </div>

                ${currentCard ? html`
                  <div className="relative flex-1 flex flex-col min-h-[520px]">
                    <div className="absolute inset-0 top-3 scale-[0.95] opacity-40 bg-slate-800 rounded-[28px] border border-slate-700 pointer-events-none"></div>
                    <div onPointerDown=${handlePointerDown} onPointerMove=${handlePointerMove} onPointerUp=${handlePointerUp} onPointerCancel=${handlePointerUp} style=${{ transform: swipeFeedback === 'like' ? 'translateX(420px) rotate(16deg)' : swipeFeedback === 'nope' ? 'translateX(-420px) rotate(-16deg)' : `translateX(${dragX}px) rotate(${rotation}deg)`, transition: isDragging ? 'none' : 'transform 0.25s' }} className="relative flex-1 flex flex-col bg-slate-900 border border-slate-700/90 rounded-[28px] shadow-2xl overflow-hidden cursor-grab active:cursor-grabbing swipe-card-surface">
                      <div style=${{ opacity: swipeFeedback === 'like' ? 1 : likeOpacity }} className="pointer-events-none absolute top-6 left-5 z-30 border-4 border-orange-500 text-orange-500 font-black text-xl tracking-widest px-3 py-1 rounded-xl -rotate-12 bg-slate-950/80 shadow-lg">MERKEN ❤️</div>
                      <div style=${{ opacity: swipeFeedback === 'nope' ? 1 : nopeOpacity }} className="pointer-events-none absolute top-6 right-5 z-30 border-4 border-slate-500 text-slate-500 font-black text-xl tracking-widest px-3 py-1 rounded-xl rotate-12 bg-slate-950/80 shadow-lg">WEITER ✕</div>

                      <div className=${`bg-gradient-to-br ${determineSemanticRecipeColor(currentCard.title, currentCard.ingredients)} p-4 pb-3.5 relative`}>
                        <div className="flex items-center justify-end z-40 relative">
                          <button onClick=${() => toggleFavorite(currentCard)} className="p-2 rounded-full bg-slate-950/40 border border-white/10 backdrop-blur-md text-white shadow-sm transition hover:scale-110 shrink-0">
                            <${Icons.Star} className=${`w-4 h-4 ${favorites.some(f => f.id === currentCard.id) ? 'fill-amber-400 text-amber-400' : 'fill-none text-white'}`} />
                          </button>
                        </div>
                        <div className="mt-1 flex items-center gap-3">
                          <div className="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-md flex items-center justify-center text-3xl shadow-inner shrink-0 border border-white/20 overflow-hidden">
                            ${!currentCardImgError ? html`
                              <img 
                                src=${`img/${currentCard.id}.jpg`} 
                                alt=${currentCardDisplay.title} 
                                onError=${() => setCurrentCardImgError(true)} 
                                className="w-full h-full object-cover" 
                              />
                            ` : currentCard.emoji}
                          </div>
                          <div className="min-w-0 flex-1">
                            <h2 className="text-lg font-extrabold text-white leading-snug line-clamp-2">${currentCardDisplay.title}</h2>
                            <p className="text-xs text-white/90 mt-0.5 line-clamp-2">${currentCardDisplay.subtitle}</p>
                          </div>
                        </div>
                      </div>

                      <${MacroBar} calories=${currentCard.calories} protein=${currentCard.protein} carbs=${currentCard.carbs} fat=${currentCard.fat} prepTimeActive=${currentCard.prepTimeActive} fridgeDays=${currentCard.fridgeDays} freezerMonths=${currentCard.freezerMonths} />

                      <div className="flex items-center gap-1 px-3.5 pt-2.5 bg-slate-900 no-drag">

                  </div>

                  ${planSubView === 'schedule' ? html`
                    <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3 space-y-2">
                      <div className="flex items-center justify-between text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                        <span>Tag filtern (Tippe auf ein Gericht zum Nachkochen)</span>
                        ${planDayFilter !== 'Alle' ? html`
                          <button onClick=${() => setPlanDayFilter('Alle')} className="text-cyan-400 hover:underline">Alle Tage</button>
                        ` : ''}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        ${WEEKDAYS.map((day) => {
                          const sum = selectedPlan.items.reduce((s, r) => s + (getDayPortions(r)[day.short] || 0), 0);
                          const isSelected = planDayFilter === day.short;
                          return html`
                            <button
                              key=${day.short}
                              onClick=${() => setPlanDayFilter(planDayFilter === day.short ? 'Alle' : day.short)}
                              className=${`py-1.5 rounded-xl border text-center flex flex-col items-center justify-center ${isSelected ? 'bg-cyan-500 text-slate-950 border-cyan-400 font-extrabold' : sum > 0 ? 'bg-indigo-500/20 border-indigo-500/40 text-indigo-200 font-bold' : 'bg-slate-900 border-slate-800 text-slate-500'}`}
                            >
                              <span className="text-[11px]">${day.short}</span>
                              <span className="text-[9px] mt-0.5">${sum > 0 ? `${sum}P` : '–'}</span>
                            </button>
                          `;
                        })}
                      </div>
                    </div>

                    <div className="space-y-3 pb-4">
                      ${WEEKDAYS.filter((d) => planDayFilter === 'Alle' || planDayFilter === d.short).map((day) => {
                        const dayMeals = selectedPlan.items.filter((it) => (getDayPortions(it)[day.short] || 0) > 0);
                        if (dayMeals.length === 0) return null;
                        return html`
                          <div key=${day.short} className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                            <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                              <span className="text-xs font-extrabold text-indigo-300 flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                                <span>${day.full}</span>
                              </span>
                              <span className="text-[11px] font-bold text-slate-400">
                                ${dayMeals.reduce((acc, m) => acc + (getDayPortions(m)[day.short] || 0), 0)} Portionen
                              </span>
                            </div>
                            <div className="space-y-2">
                              ${dayMeals.map((item) => {
                                const { title: shortMealTitle } = extractConciseTitleAndSubtitle(item.recipe.title, item.recipe.subtitle);
                                return html`
                                  <div
                                    key=${`${day.short}-${item.recipe.id}`}
                                    onClick=${() => setCookingModalItem(item)}
                                    className="flex items-center justify-between gap-2 bg-slate-900 hover:bg-slate-800/90 border border-slate-800 p-2.5 rounded-xl cursor-pointer transition"
                                  >
                                    <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                      <span className="text-2xl shrink-0">${item.recipe.emoji}</span>
                                      <div className="min-w-0 flex-1">
                                        <h4 className="text-xs font-extrabold text-white truncate">${shortMealTitle}</h4>
                                        <p className="text-[10px] text-emerald-400 font-semibold">
                                          Für ${day.full}: ${getDayPortions(item)[day.short]} Port. (Gesamt: ${getTotalPortions(item)}P)
                                        </p>
                                      </div>
                                    </div>
                                    <span className="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-[11px] font-extrabold shrink-0 flex items-center gap-1">
                                      <${Icons.ChefHat} className="w-3.5 h-3.5" />
                                      <span>Kochen</span>
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })}

                      ${planDayFilter === 'Alle' ? (() => {
                        const unassignedMeals = selectedPlan.items.filter((it) => Object.keys(getDayPortions(it)).length === 0);
                        if (unassignedMeals.length === 0) return null;
                        return html`
                          <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                            <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                              <span className="text-xs font-extrabold text-amber-300">Flexibel eingeplante Gerichte (ohne festen Wochentag)</span>
                            </div>
                            <div className="space-y-2">
                              ${unassignedMeals.map((item) => {
                                const { title: shortMealTitle } = extractConciseTitleAndSubtitle(item.recipe.title, item.recipe.subtitle);
                                return html`
                                  <div
                                    key=${item.recipe.id}
                                    onClick=${() => setCookingModalItem(item)}
                                    className="flex items-center justify-between gap-2 bg-slate-900 hover:bg-slate-800/90 border border-slate-800 p-2.5 rounded-xl cursor-pointer transition"
                                  >
                                    <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                      <span className="text-2xl shrink-0">${item.recipe.emoji}</span>
                                      <div className="min-w-0 flex-1">
                                        <h4 className="text-xs font-extrabold text-white truncate">${shortMealTitle}</h4>
                                        <p className="text-[10px] text-emerald-400 font-semibold">${getTotalPortions(item)} Portionen eingeplant</p>
                                      </div>
                                    </div>
                                    <span className="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-[11px] font-extrabold shrink-0 flex items-center gap-1">
                                      <${Icons.ChefHat} className="w-3.5 h-3.5" />
                                      <span>Kochen</span>
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })() : ''}
                    </div>
                  ` : html`
                    <div className="flex items-center justify-between bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5">
                      <div>
                        <h2 className="text-sm font-extrabold text-white">Smarte Einkaufsliste</h2>
                        <p className="text-[11px] text-slate-400">Summiert für ${selectedPlanStats.totalPortions} Portionen (${selectedPlan.name})</p>
                      </div>
                      <button
                        onClick=${handleCopyPlanShoppingList}
                        className="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                      >
                        <${Icons.Copy} className="w-3.5 h-3.5" />
                        <span>Kopieren</span>
                      </button>
                    </div>

                    <div className="space-y-4 pb-4">
                      ${CATEGORY_ORDER.map(({ key, icon, badge }) => {
                        const items = selectedPlanShoppingList[key] || [];
                        if (items.length === 0) return null;
                        const planChecked = selectedPlan.checkedItems || {};
                        return html`
                          <div key=${key} className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className=${`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border ${badge}`}>
                                <span>${icon}</span>
                                <span>${key}</span>
                              </span>
                            </div>
                            <div className="divide-y divide-slate-800/60">
                              ${items.map((item) => {
                                const isChecked = !!planChecked[item.id];
                                return html`
                                  <div
                                    key=${item.id}
                                    onClick=${() => handleTogglePlanShoppingItem(selectedPlan.id, item.id)}
                                    className="py-2 flex items-center justify-between gap-2 cursor-pointer"
                                  >
                                    <div className="flex items-center gap-2.5">
                                      <div className=${`w-4 h-4 rounded-md border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>
                                        ${isChecked ? html`<${Icons.Check} className="w-3 h-3 stroke-[3]" />` : ''}
                                      </div>
                                      <div>
                                        <div className=${`text-xs font-medium ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}`}>${item.name}</div>
                                        <div className="text-[10px] text-slate-500 truncate max-w-[210px]">Für: ${item.sources.join(', ')}</div>
                                      </div>
                                    </div>
                                    <span className=${`text-xs font-extrabold whitespace-nowrap ${isChecked ? 'line-through text-slate-600' : 'text-emerald-400'}`}>
                                      ${item.amount} ${item.unit}
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })}
                    </div>
                  `}
                `}
              </main>
            ` : ''}
          </div>
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
