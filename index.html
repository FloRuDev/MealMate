      {
        id: 'rec-3',

    const buildStandalone300Recipes = () => {
      if (Array.isArray(window.MEALMATE_RECIPES) && window.MEALMATE_RECIPES.length >= 300) {
        return window.MEALMATE_RECIPES;
      }
      return BASE_SIGNATURE_RECIPES;
    };

    const ALL_RECIPES = buildStandalone300Recipes();

    // ============================================================================
    // REINE DOMÄNEN-FUNKTIONEN
    // ============================================================================
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const getDayPortions = (item) => {
      if (!item) return {};
      if (item.dayPortions && typeof item.dayPortions === 'object') return item.dayPortions;
      if (item.weekday) return { [item.weekday]: item.portions || APP_CONFIG.DEFAULT_BASE_PORTIONS };
      return {};
    };

    const getTotalPortions = (item) => {
      if (!item) return APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const dp = getDayPortions(item);
      const days = Object.keys(dp);
      if (days.length > 0) return days.reduce((sum, day) => sum + (Number(dp[day]) || 0), 0);
      return item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
    };

    const formatDaySchedule = (item) => {
      const dp = getDayPortions(item);
      return WEEKDAYS.filter((d) => (dp[d.short] || 0) > 0)
        .map((d) => `${d.short}: ${dp[d.short]}P`)
        .join(', ');
    };

    const applyWeekdayToggle = (item, dayShort, defaultPortions = APP_CONFIG.DEFAULT_DAY_PORTIONS) => {
      const currentDp = { ...getDayPortions(item) };
      if (currentDp[dayShort]) delete currentDp[dayShort];
      else currentDp[dayShort] = defaultPortions;
      
      const remainingDays = WEEKDAYS.map((d) => d.short).filter((d) => currentDp[d] > 0);
      const nextTotal = remainingDays.length > 0 ? remainingDays.reduce((sum, d) => sum + currentDp[d], 0) : item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
      return { ...item, dayPortions: currentDp, portions: nextTotal, weekday: remainingDays[0] || null };
    };

    const applyDayPortionDelta = (item, dayShort, delta) => {
      const currentDp = { ...getDayPortions(item) };
      const currentVal = currentDp[dayShort] || APP_CONFIG.DEFAULT_DAY_PORTIONS;
      currentDp[dayShort] = clamp(currentVal + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_DAY_PORTIONS);
      const nextTotal = Object.values(currentDp).reduce((sum, v) => sum + v, 0);
      return { ...item, dayPortions: currentDp, portions: nextTotal };
    };

    const applyBasePortionDelta = (item, delta) => {
      const currentPortions = item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const nextPortions = clamp(currentPortions + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_TOTAL_PORTIONS);
      return { ...item, portions: nextPortions };
    };

    const CATEGORY_ORDER = [
      { key: 'Obst & Gemüse', icon: '🥦', badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' },
      { key: 'Fleisch & Frische', icon: '🍗', badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30' },
      { key: 'Kühlregal', icon: '🥛', badge: 'bg-sky-500/15 text-sky-300 border-sky-500/30' },
      { key: 'Tiefkühlung', icon: '❄️', badge: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
      { key: 'Vorratsschrank', icon: '🥫', badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30' }
    ];

    const aggregateShoppingList = (planRecipes) => {
      const map = {};
      const validCategories = new Set(CATEGORY_ORDER.map((c) => c.key));
      (planRecipes || []).forEach((item) => {
        const { recipe } = item;
        if (!recipe || !Array.isArray(recipe.ingredients)) return;
        const totalPortions = getTotalPortions(item);
        const scheduleLabel = formatDaySchedule(item);
        const basePortions = recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
        const scale = totalPortions / basePortions;

        recipe.ingredients.forEach((ing) => {
          const normCategory = validCategories.has(ing.category) ? ing.category : 'Vorratsschrank';
          const key = `${normCategory}__${ing.name.toLowerCase().trim()}__${ing.unit.toLowerCase().trim()}`;
          if (!map[key]) map[key] = { id: key, name: ing.name, unit: ing.unit, category: normCategory, amount: 0, sources: [] };
          map[key].amount += ing.amount * scale;
          const sourceLabel = scheduleLabel ? `${recipe.title} (${scheduleLabel})` : `${recipe.title} (${totalPortions}P)`;
          if (!map[key].sources.includes(sourceLabel)) map[key].sources.push(sourceLabel);
        });
      });
      const grouped = {};
      CATEGORY_ORDER.forEach((cat) => { grouped[cat.key] = []; });
      Object.values(map).forEach((entry) => {
        const roundedAmount = entry.amount >= 10 ? Math.round(entry.amount) : Math.round(entry.amount * 10) / 10;
        grouped[entry.category].push({ ...entry, amount: roundedAmount });
      });
      return grouped;
    };

    const calculatePlanStats = (planItems) => {
      const targetList = planItems || [];
      if (targetList.length === 0) return { totalPortions: 0, avgCalories: 0, avgProtein: 0 };
      let totalPortions = 0, weightedCal = 0, weightedProt = 0;
      targetList.forEach((item) => {
        const portions = getTotalPortions(item);
        totalPortions += portions;
        weightedCal += (item.recipe?.calories || 0) * portions;
        weightedProt += (item.recipe?.protein || 0) * portions;
      });
      return {
        totalPortions,
        avgCalories: totalPortions > 0 ? Math.round(weightedCal / totalPortions) : 0,
        avgProtein: totalPortions > 0 ? Math.round(weightedProt / totalPortions) : 0
      };
    };

    const formatShoppingListText = (planName = 'Wochenplan', planRecipes = [], aggregatedShoppingList = {}, checkedItems = {}) => {
      const lines = [`🛒 MEALMATE EINKAUFSLISTE – ${planName.toUpperCase()}`, ''];
      if (planRecipes.length > 0) {
        lines.push('Geplante Gerichte:');
        planRecipes.forEach((item) => {
          const schedule = formatDaySchedule(item);
          lines.push(`- ${item.recipe?.title}: ${getTotalPortions(item)} Portionen${schedule ? ` (${schedule})` : ''}`);
        });
        lines.push('');
      }
      CATEGORY_ORDER.forEach(({ key, icon }) => {
        const items = aggregatedShoppingList[key] || [];
        if (items.length === 0) return;
        lines.push(`${icon} ${key.toUpperCase()}`);
        items.forEach((item) => { lines.push(`${checkedItems[item.id] ? '[x]' : '[ ]'} ${item.amount} ${item.unit} ${item.name}`); });
        lines.push('');
      });
      return lines.join('\n').trim();
    };

    const coercePositiveNumber = (val, fallback, min = 0, max = 10000) => {
      const num = typeof val === 'number' ? val : Number(String(val ?? '').replace(',', '.'));
      if (!Number.isFinite(num)) return fallback;
      return clamp(num, min, max);
    };

    const coerceNonEmptyString = (val, fallback) => {
      if (typeof val === 'string' && val.trim().length > 0) return val.trim();
      return fallback;
    };

    const validateAndSanitizeRecipe = (raw, fallbackIdPrefix = 'rec-validated', index = 0) => {
      if (!raw || typeof raw !== 'object') return { valid: false, recipe: null };
      const title = coerceNonEmptyString(raw.title, '');
      if (!title) return { valid: false, recipe: null };
      
      const rawIngredients = Array.isArray(raw.ingredients) ? raw.ingredients : [];
      const sanitizedIngredients = rawIngredients.length > 0 ? rawIngredients.map((ing, idx) => ({
        name: coerceNonEmptyString(ing.name, `Zutat ${idx + 1}`),
        amount: coercePositiveNumber(ing.amount, 100, 0.1, 5000),
        unit: coerceNonEmptyString(ing.unit, 'g'),
        category: CATEGORY_ORDER.some(c => c.key === ing.category) ? ing.category : 'Vorratsschrank'
      })) : [{ name: 'Hauptzutat', amount: 400, unit: 'g', category: 'Fleisch & Frische' }];

      const rawSteps = Array.isArray(raw.steps) ? raw.steps.map((s) => coerceNonEmptyString(s, '')).filter(Boolean) : [];
      const shortStamp = String(Date.now()).slice(-4);
      
      return {
        valid: true,
        recipe: {
          id: coerceNonEmptyString(raw.id, `${fallbackIdPrefix}-${shortStamp}-${index + 1}`),
          title,
          subtitle: coerceNonEmptyString(raw.subtitle, 'Leckeres Familien-Rezept'),
          emoji: coerceNonEmptyString(raw.emoji, '🍲'),
          accentColor: coerceNonEmptyString(raw.accentColor, ACCENT_GRADIENTS[index % ACCENT_GRADIENTS.length]),
          prepTimeActive: Math.round(coercePositiveNumber(raw.prepTimeActive, 15, 5, 120)),
          prepTimePassive: Math.round(coercePositiveNumber(raw.prepTimePassive, 20, 0, 240)),
          effortLevel: coerceNonEmptyString(raw.effortLevel, 'Gering'),
          fridgeDays: Math.round(coercePositiveNumber(raw.fridgeDays, 3, 1, 7)),
          freezerMonths: Math.round(coercePositiveNumber(raw.freezerMonths, 2, 0, 12)),
          toddlerNote: coerceNonEmptyString(raw.toddlerNote, 'Mild gewürzt'),
          calories: Math.round(coercePositiveNumber(raw.calories, 500, 150, 1500)),
          protein: Math.round(coercePositiveNumber(raw.protein, 40, 5, 150)),
          carbs: Math.round(coercePositiveNumber(raw.carbs, 50, 0, 250)),
          fat: Math.round(coercePositiveNumber(raw.fat, 12, 1, 100)),
          basePortions: Math.round(coercePositiveNumber(raw.basePortions, APP_CONFIG.DEFAULT_BASE_PORTIONS, 1, 12)),
          ingredients: sanitizedIngredients,
          steps: rawSteps.length > 0 ? rawSteps : ['Zutaten vorbereiten und kochen.']
        }
      };
    };

    const mergeRecipesIntoDatabase = (currentDatabase = [], incomingRecipes = []) => {
      const updatedDb = [...currentDatabase];
      const seenIds = new Set(updatedDb.map((r) => r?.id).filter(Boolean));
      (incomingRecipes || []).forEach((recipe, idx) => {
        if (!recipe || !recipe.title) return;
        const ensuredId = recipe.id || `db-rec-${Date.now()}-${idx}`;
        if (!seenIds.has(ensuredId)) {
          seenIds.add(ensuredId);
          updatedDb.push(recipe);
        }
      });
      return updatedDb;
    };

    const pickRandomRecipe = (database = [], excludeId = null, rng = Math.random) => {
      if (!Array.isArray(database) || database.length === 0) return null;
      if (database.length === 1) return database[0];
      const candidates = excludeId ? database.filter((r) => r?.id !== excludeId) : database;
      const pool = candidates.length > 0 ? candidates : database;
      return pool[Math.floor(rng() * pool.length)];
    };

    // ============================================================================
    // OFFLINE CACHE (INDEXED DB + LOCALSTORAGE)
    // ============================================================================
    const OfflineCacheEngine = (() => {
      const memoryFallback = {};
      const openDb = () => new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB nicht verfügbar')); return; }
        const req = window.indexedDB.open(APP_CONFIG.IDB_NAME, APP_CONFIG.IDB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains('kvStore')) e.target.result.createObjectStore('kvStore');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      const getSyncItem = (key, defaultVal) => {
        try { const raw = window.localStorage.getItem(`mealmate_${key}`); if (raw) return JSON.parse(raw); } catch {}
        return memoryFallback[key] ?? defaultVal;
      };

      const getItem = async (key, defaultVal) => {
        const syncVal = getSyncItem(key, undefined);
        if (syncVal !== undefined) return syncVal;
        try {
          const idb = await openDb();
          const val = await new Promise((resolve) => {
            const req = idb.transaction('kvStore', 'readonly').objectStore('kvStore').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(undefined);
          });
          if (val !== undefined) return val;
        } catch {}
        return defaultVal;
      };

      const setItem = async (key, value) => {
        memoryFallback[key] = value;
        try { window.localStorage.setItem(`mealmate_${key}`, JSON.stringify(value)); } catch {}
        try {
          const idb = await openDb();
          await new Promise((resolve) => {
            const tx = idb.transaction('kvStore', 'readwrite');
            tx.objectStore('kvStore').put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch {}
      };
      return { getSyncItem, getItem, setItem };
    })();

    // ============================================================================
    // API CALLS (BFF GATEWAY SIMULATION)
    // ============================================================================
    async function callGeminiRecipeAgent(userInstruction, currentRecipeContext, userApiKey) {
      if (!userApiKey) throw new Error('Kein API Key');
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userApiKey.trim())}`;
      const promptText = currentRecipeContext
        ? `Wandle dieses Familien-Meal-Prep-Rezept nach folgendem Wunsch ab: "${userInstruction}". Bestehendes Rezept: ${JSON.stringify(currentRecipeContext)}. Behalte 4 Portionen und mindestens 35g Protein bei.`
        : `Erstelle ein neues Familien-Meal-Prep-Rezept (4 Portionen, mind. 35g Protein): "${userInstruction}".`;
      
      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              title: { type: 'STRING' },
              subtitle: { type: 'STRING' },
              emoji: { type: 'STRING' },
              prepTimeActive: { type: 'INTEGER' },
              prepTimePassive: { type: 'INTEGER' },
              effortLevel: { type: 'STRING' },
              fridgeDays: { type: 'INTEGER' },
              freezerMonths: { type: 'INTEGER' },
              toddlerNote: { type: 'STRING' },
              calories: { type: 'INTEGER' },
              protein: { type: 'INTEGER' },
              carbs: { type: 'INTEGER' },
              fat: { type: 'INTEGER' },
              ingredients: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: {
                    name: { type: 'STRING' },
                    amount: { type: 'NUMBER' },
                    unit: { type: 'STRING' },
                    category: { type: 'STRING' }
                  }
                }
              },
              steps: { type: 'ARRAY', items: { type: 'STRING' } }
            }
          }
        }
      };
      const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rawParsed = JSON.parse((await response.json())?.candidates?.[0]?.content?.parts?.[0]?.text);
      const baseId = currentRecipeContext?.id ? `${currentRecipeContext.id}-ki` : `ki-${String(Date.now()).slice(-4)}`;
      const { valid, recipe } = validateAndSanitizeRecipe({ ...rawParsed, id: baseId }, 'ki');
      if (!valid) throw new Error('Formatfehler');
      return recipe;
    }

    function applyLocalRecipeVariation(recipe, instructionText) {
      const lower = (instructionText || '').toLowerCase();
      const cloned = JSON.parse(JSON.stringify(recipe));
      cloned.id = `${recipe.id || 'rec'}-umbau`;

      if (lower.includes('reis')) {
        cloned.title = `${recipe.title.split('dazu')[0].split('&')[0].trim()} dazu Basmatireis`;
        cloned.ingredients = cloned.ingredients.map((ing) =>
          /kartoffel|nudel|gnocchi|spätzle|penne/i.test(ing.name)
            ? { name: 'Basmatireis (ungekocht)', amount: 260, unit: 'g', category: 'Vorratsschrank' }
            : ing
        );
      } else if (lower.includes('vegetarisch') || lower.includes('quark') || lower.includes('hüttenkäse')) {
        cloned.title = `${recipe.title} (Veggie High-Protein)`;
        cloned.emoji = '🌱';
        cloned.ingredients = cloned.ingredients.map((ing) =>
          ing.category === 'Fleisch & Frische'
            ? { name: 'Körniger Frischkäse & Rote Linsen Mix', amount: 480, unit: 'g', category: 'Kühlregal' }
            : ing
        );
      } else {
        cloned.title = `${recipe.title} (${instructionText})`;
        cloned.prepTimeActive = Math.max(10, (cloned.prepTimeActive || 15) - 5);
        cloned.effortLevel = 'Minimal (TK-Optimiert)';
      }
      return cloned;
    }

                        onClick=${() => setScaleToPlanned(true)}
                        className=${`px-2 py-0.5 rounded-lg font-bold transition ${scaleToPlanned ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                      >
                        Plan (${plannedPortions}P)
                      </button>
                      <button
                        onClick=${() => setScaleToPlanned(false)}
                        className=${`px-2 py-0.5 rounded-lg font-bold transition ${!scaleToPlanned ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                      >
                        Basis (${basePortions}P)
                      </button>
                    </div>
                  </div>
                  <ul className="space-y-1.5">
                    ${recipe.ingredients.map((ing, idx) => {
                      const rawScaled = ing.amount * scaleFactor;
                      const displayAmount = rawScaled >= 10 ? Math.round(rawScaled) : Math.round(rawScaled * 10) / 10;
                      return html`
                        <li key=${idx} className="flex items-center justify-between text-xs bg-slate-950/70 border border-slate-800/80 px-3 py-2 rounded-xl">
                          <span className="text-slate-200 font-medium">${ing.name}</span>
                          <span className="text-emerald-400 font-bold ml-2 whitespace-nowrap">${displayAmount} ${ing.unit}</span>
                        </li>
                      `;
                    })}
                  </ul>
                </div>
              ` : html`
                <div className="space-y-2">
                  ${recipe.steps.map((step, i) => html`
                    <div key=${i} className="flex items-start gap-2.5 bg-slate-950/70 border border-slate-800/80 p-3 rounded-xl text-xs text-slate-200 leading-relaxed">
                      <span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>
                      <p>${step}</p>
                    </div>
                  `)}
                </div>
              `}
            </div>

            <div className="p-3 bg-slate-950 border-t border-slate-800 shrink-0">
              <button
                onClick=${onClose}
                className="w-full py-2.5 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs transition"
              >
                Fertig mit Rezeptkarte
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function App() {
      const [setupModalOpen, setSetupModalOpen] = useState(false);
      const [userApiKey, setUserApiKey] = useState(() => OfflineCacheEngine.getSyncItem('geminiApiKey', ''));
      
      const [recipeDatabase, setRecipeDatabase] = useState(() => {
        const cached = OfflineCacheEngine.getSyncItem('recipes', []);
        return cached.length > 0 ? mergeRecipesIntoDatabase(ALL_RECIPES, cached) : ALL_RECIPES;
      });
      const [currentCard, setCurrentCard] = useState(() => pickRandomRecipe(ALL_RECIPES));
      const [savedRecipes, setSavedRecipes] = useState(() => OfflineCacheEngine.getSyncItem('mealPlans', []));

      // Gespeicherte Wochenpläne für den neuen Reiter "MyPrep"
      const [weeklyPlans, setWeeklyPlans] = useState(() => OfflineCacheEngine.getSyncItem('weeklyPlans', []));
      const [newPlanName, setNewPlanName] = useState('');
      const [selectedPlanId, setSelectedPlanId] = useState(null);
      const [planSubView, setPlanSubView] = useState('schedule'); // 'schedule' | 'shopping'
      const [planDayFilter, setPlanDayFilter] = useState('Alle');
      const [cookingModalItem, setCookingModalItem] = useState(null);

      const [activeView, setActiveView] = useState('swipe'); // 'swipe' | 'saved' | 'myprep'
      const [cardTab, setCardTab] = useState('ingredients');
      const [weekdayFilter, setWeekdayFilter] = useState('Alle');

      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [swipeFeedback, setSwipeFeedback] = useState(null);
      const startXRef = useRef(0);
      const [aiInput, setAiInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiStatusMessage, setAiStatusMessage] = useState('');

      useEffect(() => {
        (async () => {
          const cachedCustom = await OfflineCacheEngine.getItem('recipes', []);
          const cachedPlans = await OfflineCacheEngine.getItem('mealPlans', []);
          const cachedWeeklyPlans = await OfflineCacheEngine.getItem('weeklyPlans', []);
          if (cachedCustom.length > 0) setRecipeDatabase((prev) => mergeRecipesIntoDatabase(prev, cachedCustom));
          if (cachedPlans.length > 0) setSavedRecipes((prev) => (prev.length === 0 ? cachedPlans : prev));
          if (cachedWeeklyPlans.length > 0) setWeeklyPlans((prev) => (prev.length === 0 ? cachedWeeklyPlans : prev));
        })();
      }, []);

      const showTemporaryStatus = useCallback((message) => {
        setAiStatusMessage(message);
        setTimeout(() => setAiStatusMessage(''), APP_CONFIG.TOAST_DURATION_MS);
      }, []);

      const handleSaveApiKey = (newKey) => {
        setUserApiKey(newKey);
        OfflineCacheEngine.setItem('geminiApiKey', newKey);
        showTemporaryStatus(newKey ? 'API-Key gespeichert!' : 'Offline-Modus aktiv!');
      };

      const updateSavedRecipesWithPersistence = useCallback((updaterFn) => {
        setSavedRecipes((prev) => {
          const updated = updaterFn(prev);
          OfflineCacheEngine.setItem('mealPlans', updated);
          return updated;
        });
      }, []);

      const updateWeeklyPlansWithPersistence = useCallback((updaterFn) => {
        setWeeklyPlans((prev) => {
          const updated = updaterFn(prev);
          OfflineCacheEngine.setItem('weeklyPlans', updated);
          return updated;
        });
      }, []);

      const addRecipesToDatabaseWithPersistence = useCallback((newRecipes) => {
        let updatedDb = [];
        setRecipeDatabase((prev) => {
          const merged = mergeRecipesIntoDatabase(prev, newRecipes);
          updatedDb = merged;
          OfflineCacheEngine.setItem('recipes', merged.filter((r) => !ALL_RECIPES.some((b) => b.id === r.id)));
          return merged;
        });
        return updatedDb;
      }, []);

      const triggerDecision = (decision) => {
        if (!currentCard || isGenerating) return;
        setSwipeFeedback(decision);
        setTimeout(() => {
          if (decision === 'like') {
            updateSavedRecipesWithPersistence((prev) => {
              if (prev.some((item) => item.recipe.id === currentCard.id)) return prev;
              return [...prev, { recipe: currentCard, portions: currentCard.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS, dayPortions: {} }];
            });
          }
          setDragX(0);
          setSwipeFeedback(null);
          setCardTab('ingredients');
          setCurrentCard((prevCard) => pickRandomRecipe(recipeDatabase, prevCard?.id));
        }, APP_CONFIG.SWIPE_ANIMATION_MS);
      };

      const handlePointerDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.no-drag')) return;
        setIsDragging(true);
        startXRef.current = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
      };
      const handlePointerMove = (e) => {
        if (!isDragging) return;
        setDragX((e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0) - startXRef.current);
      };
      const handlePointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (dragX > APP_CONFIG.SWIPE_THRESHOLD_PX) triggerDecision('like');
        else if (dragX < -APP_CONFIG.SWIPE_THRESHOLD_PX) triggerDecision('nope');
        else setDragX(0);
      };

      const handleModifyCurrentRecipe = async (instructionText) => {
        const query = instructionText || aiInput.trim();
        if (!query || !currentCard || isGenerating) return;
        setIsGenerating(true);
        setAiStatusMessage(`Rezept wird angepasst...`);
        try {
          let newRecipe;
          if (userApiKey) {
            newRecipe = await callGeminiRecipeAgent(query, currentCard, userApiKey);
          } else {
            newRecipe = applyLocalRecipeVariation(currentCard, query);
          }
          const updatedDb = addRecipesToDatabaseWithPersistence([newRecipe]);
          const insertedRecipe = updatedDb.find((r) => r.id === newRecipe.id) || newRecipe;
          setCurrentCard(insertedRecipe);
          setAiInput(''); setCardTab('ingredients');
          showTemporaryStatus(userApiKey ? 'Rezept per KI angepasst!' : 'Rezept lokal angepasst (Offline-Modus)!');
        } catch {
          const fallbackRecipe = applyLocalRecipeVariation(currentCard, query);
          const updatedDb = addRecipesToDatabaseWithPersistence([fallbackRecipe]);
          const insertedRecipe = updatedDb.find((r) => r.id === fallbackRecipe.id) || fallbackRecipe;
          setCurrentCard(insertedRecipe);
          setAiInput(''); setCardTab('ingredients');
          showTemporaryStatus('Rezept mit lokalem Baukasten angepasst!');
        } finally { setIsGenerating(false); }
      };

      // Speichert die aktuelle Merkliste als benannten Wochenplan für "MyPrep"
      const handleSaveWeeklyPlan = () => {
        if (savedRecipes.length === 0) return;
        const defaultName = `Wochenplan #${weeklyPlans.length + 1} (${new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })})`;
        const finalName = newPlanName.trim() || defaultName;
        const newPlanId = `plan-${Date.now()}`;

        const clonedItems = JSON.parse(JSON.stringify(savedRecipes));
        const newPlan = {
          id: newPlanId,
          name: finalName,
          createdAt: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }),
          items: clonedItems,
          checkedItems: {}
        };

        updateWeeklyPlansWithPersistence((prev) => [newPlan, ...prev]);
        setNewPlanName('');
        setSelectedPlanId(newPlanId);
        setPlanSubView('schedule');
        setPlanDayFilter('Alle');
        setActiveView('myprep');
        showTemporaryStatus(`Wochenplan „${finalName}“ in MyPrep gespeichert!`);
      };

      const handleDeleteWeeklyPlan = (planId, e) => {
        if (e) e.stopPropagation();
        updateWeeklyPlansWithPersistence((prev) => prev.filter((p) => p.id !== planId));
        if (selectedPlanId === planId) {
          setSelectedPlanId(null);
        }
        showTemporaryStatus('Wochenplan gelöscht.');
      };

      const handleTogglePlanShoppingItem = (planId, itemId) => {
        updateWeeklyPlansWithPersistence((prev) =>
          prev.map((plan) => {
            if (plan.id !== planId) return plan;
            const currentChecked = plan.checkedItems || {};
            return {
              ...plan,
              checkedItems: {
                ...currentChecked,
                [itemId]: !currentChecked[itemId]
              }
            };
          })
        );
      };

      const selectedPlan = useMemo(
        () => weeklyPlans.find((p) => p.id === selectedPlanId) || null,
        [weeklyPlans, selectedPlanId]
      );

      const selectedPlanShoppingList = useMemo(
        () => (selectedPlan ? aggregateShoppingList(selectedPlan.items) : {}),
        [selectedPlan]
      );

      const selectedPlanStats = useMemo(
        () => (selectedPlan ? calculatePlanStats(selectedPlan.items) : { totalPortions: 0, avgCalories: 0, avgProtein: 0 }),
        [selectedPlan]
      );

      const savedListStats = useMemo(
        () => calculatePlanStats(savedRecipes),
        [savedRecipes]
      );

      const handleCopyPlanShoppingList = async () => {
        if (!selectedPlan) return;
        const text = formatShoppingListText(
          selectedPlan.name,
          selectedPlan.items,
          selectedPlanShoppingList,
          selectedPlan.checkedItems || {}
        );
        if (navigator.share) {
          try {
            await navigator.share({ title: `Einkaufsliste – ${selectedPlan.name}`, text });
            return;
          } catch {}
        }
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showTemporaryStatus('Einkaufsliste in die Zwischenablage kopiert!');
        } catch {
          showTemporaryStatus('Kopieren fehlgeschlagen.');
        }
      };

      const rotation = (dragX / APP_CONFIG.SWIPE_ROTATION_DIVISOR).toFixed(2);
      const likeOpacity = clamp(dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);
      const nopeOpacity = clamp(-dragX / APP_CONFIG.SWIPE_OPACITY_DIVISOR, 0, 1);

      return html`
        <div className="min-h-screen bg-[#0B132B] text-slate-100 flex flex-col items-center justify-start ios-safe-container relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>
          
          <${SetupModal} isOpen=${setupModalOpen} onClose=${() => setSetupModalOpen(false)} apiKey=${userApiKey} onSaveApiKey=${handleSaveApiKey} />
          <${CookRecipeModal} item=${cookingModalItem} onClose=${() => setCookingModalItem(null)} />

          <div className="w-full max-w-[430px] flex flex-col min-h-[92vh] bg-slate-900/80 border border-slate-700/50 rounded-[32px] shadow-2xl overflow-hidden relative backdrop-blur-2xl z-10">
            
            <header className="px-4 pt-4 pb-3 border-b border-cyan-900/50 bg-slate-950/95 sticky top-0 z-30">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <h1 className="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
                    <span>Meal<span className="text-orange-400">Mate</span></span>
                  </h1>
                  <p className="text-[11px] text-cyan-400/80 flex items-center gap-1">
                    <span>Gesundes Vorkochen für Familien</span>
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  <img src="image_c159cd.jpg" alt="Logo" onError=${e => { e.currentTarget.style.display = 'none'; }} className="w-9 h-9 rounded-2xl object-cover border border-cyan-500/30" />
                  <button onClick=${() => setSetupModalOpen(true)} className="px-2 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-500/25 transition"><${Icons.Smartphone} className="w-3.5 h-3.5" /></button>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-1 p-1 bg-slate-950/90 rounded-2xl border border-slate-800/80 text-xs font-semibold">
                <button onClick=${() => setActiveView('swipe')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'swipe' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Layers} className="w-3.5 h-3.5" /><span>Karten</span></button>
                <button onClick=${() => setActiveView('saved')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'saved' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Bookmark} className="w-3.5 h-3.5" /><span>Merkliste (${savedRecipes.length})</span></button>
                <button onClick=${() => setActiveView('myprep')} className=${`py-2 rounded-xl flex items-center justify-center gap-1.5 transition ${activeView === 'myprep' ? 'bg-cyan-500 text-slate-950 shadow-md font-bold' : 'text-slate-400'}`}><${Icons.Calendar} className="w-3.5 h-3.5" /><span>MyPrep (${weeklyPlans.length})</span></button>
              </div>
            </header>

            ${aiStatusMessage ? html`
              <div className="mx-4 mt-2 px-3.5 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-medium flex items-center gap-2 z-30">
                ${isGenerating ? html`<${Icons.RefreshCw} className="w-3.5 h-3.5 animate-spin shrink-0" />` : html`<${Icons.CheckCircle2} className="w-3.5 h-3.5 shrink-0" />`}
                <span>${aiStatusMessage}</span>
              </div>
            ` : ''}

            ${activeView === 'swipe' ? html`
              <main className="flex-1 flex flex-col justify-between p-3.5 overflow-hidden">
                <div className="flex items-center justify-between px-3 py-1.5 mb-2 rounded-2xl bg-slate-950/80 border border-slate-800/90 text-[11px]">
                  <div className="flex items-center gap-1.5 text-slate-300 font-semibold"><${Icons.Database} className="w-3.5 h-3.5 text-cyan-400" /><span>Datenbank: <strong className="text-white">${recipeDatabase.length}</strong> Rezepte</span></div>
                </div>

                ${currentCard ? html`
                  <div className="relative flex-1 flex flex-col min-h-[520px]">
                    <div className="absolute inset-0 top-3 scale-[0.95] opacity-40 bg-slate-800 rounded-[28px] border border-slate-700 pointer-events-none"></div>
                    <div onMouseDown=${handlePointerDown} onMouseMove=${handlePointerMove} onMouseUp=${handlePointerUp} onMouseLeave=${handlePointerUp} onTouchStart=${handlePointerDown} onTouchMove=${handlePointerMove} onTouchEnd=${handlePointerUp} style=${{ transform: swipeFeedback === 'like' ? 'translateX(420px) rotate(16deg)' : swipeFeedback === 'nope' ? 'translateX(-420px) rotate(-16deg)' : `translateX(${dragX}px) rotate(${rotation}deg)`, transition: isDragging ? 'none' : 'transform 0.25s' }} className="relative flex-1 flex flex-col bg-slate-900 border border-slate-700/90 rounded-[28px] shadow-2xl overflow-hidden cursor-grab active:cursor-grabbing">
                      <div style=${{ opacity: swipeFeedback === 'like' ? 1 : likeOpacity }} className="pointer-events-none absolute top-6 left-5 z-30 border-4 border-orange-500 text-orange-500 font-black text-xl tracking-widest px-3 py-1 rounded-xl -rotate-12 bg-slate-950/80 shadow-lg">MERKEN ❤️</div>
                      <div style=${{ opacity: swipeFeedback === 'nope' ? 1 : nopeOpacity }} className="pointer-events-none absolute top-6 right-5 z-30 border-4 border-slate-500 text-slate-500 font-black text-xl tracking-widest px-3 py-1 rounded-xl rotate-12 bg-slate-950/80 shadow-lg">WEITER ✕</div>

                      <div className=${`bg-gradient-to-br ${currentCard.accentColor} p-4 pb-3.5 relative`}>
                        <div className="flex items-start justify-between gap-1.5 flex-wrap">
                          <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-mono font-extrabold bg-slate-950/70 text-cyan-300 border border-cyan-400/40 backdrop-blur-md shadow-sm">
                            ID: ${currentCard.id}
                          </span>
                          <div className="flex items-center gap-1.5">
                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-950/45 text-white backdrop-blur-md"><${Icons.Clock} className="w-3 h-3 text-emerald-300" />${currentCard.prepTimeActive} Min.</span>
                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-950/45 text-white backdrop-blur-md"><${Icons.Snowflake} className="w-3 h-3 text-sky-300" />${currentCard.fridgeDays}T | ${currentCard.freezerMonths}M TK</span>
                          </div>
                        </div>
                        <div className="mt-3 flex items-center gap-3">
                          <div className="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-md flex items-center justify-center text-3xl shadow-inner shrink-0 border border-white/20">${currentCard.emoji}</div>
                          <div><h2 className="text-lg font-extrabold text-white leading-snug">${currentCard.title}</h2><p className="text-xs text-white/85 mt-0.5 line-clamp-2">${currentCard.subtitle}</p></div>
                        </div>
                      </div>

                      <${MacroBar} calories=${currentCard.calories} protein=${currentCard.protein} carbs=${currentCard.carbs} fat=${currentCard.fat} />

                      <div className="flex items-center gap-1 px-3.5 pt-2.5 bg-slate-900 no-drag">
                        <button onClick=${() => setCardTab('ingredients')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${cardTab === 'ingredients' ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>📋 Zutaten</button>
                        <button onClick=${() => setCardTab('steps')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${cardTab === 'steps' ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>👨‍🍳 Ablauf</button>
                        <button onClick=${() => setCardTab('ai')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${cardTab === 'ai' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'text-slate-400'}`}><${Icons.Wand2} className="w-3 h-3" /> KI-Umbau</button>
                      </div>

                      <div className="flex-1 overflow-y-auto px-3.5 py-2.5 space-y-2 no-drag max-h-[250px] ios-scroll">
                        ${cardTab === 'ingredients' ? html`
                          <ul className="space-y-1.5">
                            ${currentCard.ingredients.map((ing, idx) => html`<li key=${idx} className="flex items-center justify-between text-xs bg-slate-950/70 border border-slate-800/80 px-3 py-1.5 rounded-xl"><span className="text-slate-200 font-medium">${ing.name}</span><span className="text-emerald-400 font-bold ml-2">${ing.amount} ${ing.unit}</span></li>`)}
                          </ul>
                        ` : ''}
                        ${cardTab === 'steps' ? html`
                          <div className="space-y-2">
                            ${currentCard.steps.map((step, i) => html`<div key=${i} className="flex items-start gap-2.5 bg-slate-950/70 border border-slate-800/80 p-2.5 rounded-xl text-xs text-slate-200"><span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span><p>${step}</p></div>`)}
                          </div>
                        ` : ''}
                        ${cardTab === 'ai' ? html`
                          <div className="space-y-2.5 py-1">
                            <p className="text-xs text-slate-300">Rezept nach Wunsch abwandeln (funktioniert sofort offline oder optional mit KI-Key):</p>
                            <div className="flex flex-wrap gap-1.5">
                              ${['Mit Reis statt Kartoffeln', 'Vegetarisch (Hüttenkäse/Quark)', 'Noch weniger Aufwand (TK)'].map((chip) => html`<button key=${chip} disabled=${isGenerating} onClick=${() => handleModifyCurrentRecipe(chip)} className="text-[11px] px-2.5 py-1.5 rounded-xl bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 font-medium hover:bg-indigo-500/25 transition disabled:opacity-50">✨ ${chip}</button>`)}
                            </div>
                            <div className="pt-1 flex gap-1.5">
                              <input type="text" value=${aiInput} onChange=${(e) => setAiInput(e.target.value)} onKeyDown=${(e) => e.key === 'Enter' && handleModifyCurrentRecipe()} placeholder="Eigener Wunsch (z.B. ohne Milch)..." className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white" />
                              <button disabled=${isGenerating || !aiInput.trim()} onClick=${() => handleModifyCurrentRecipe()} className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs disabled:opacity-40">Umbauen</button>
                            </div>
                          </div>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                  <div className="pt-3 flex items-center justify-center gap-5">
                    <button onClick=${() => triggerDecision('nope')} disabled=${isGenerating} className="w-14 h-14 rounded-full bg-slate-900 border-2 border-slate-700 text-slate-400 flex items-center justify-center active:scale-90 transition"><${Icons.X} className="w-7 h-7 stroke-[2.5]" /></button>
                    <button onClick=${() => triggerDecision('like')} disabled=${isGenerating} className="w-14 h-14 rounded-full bg-gradient-to-br from-orange-400 to-rose-500 text-white flex items-center justify-center active:scale-90 transition"><${Icons.Heart} className="w-7 h-7 fill-white stroke-[2]" /></button>
                  </div>
                ` : ''}
              </main>
            ` : ''}

            ${activeView === 'saved' ? html`
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                  <div className="flex items-center justify-between">

                    </div>

                    <div className="space-y-4 pb-4">
                      ${CATEGORY_ORDER.map(({ key, icon, badge }) => {
                        const items = selectedPlanShoppingList[key] || [];
                        if (items.length === 0) return null;
                        const planChecked = selectedPlan.checkedItems || {};
                        return html`
                          <div key=${key} className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className=${`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border ${badge}`}>
                                <span>${icon}</span>
                                <span>${key}</span>
                              </span>
                            </div>
                            <div className="divide-y divide-slate-800/60">
                              ${items.map((item) => {
                                const isChecked = !!planChecked[item.id];
                                return html`
                                  <div
                                    key=${item.id}
                                    onClick=${() => handleTogglePlanShoppingItem(selectedPlan.id, item.id)}
                                    className="py-2 flex items-center justify-between gap-2 cursor-pointer"
                                  >
                                    <div className="flex items-center gap-2.5">
                                      <div className=${`w-4 h-4 rounded-md border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>
                                        ${isChecked ? html`<${Icons.Check} className="w-3 h-3 stroke-[3]" />` : ''}
                                      </div>
                                      <div>
                                        <div className=${`text-xs font-medium ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}`}>${item.name}</div>
                                        <div className="text-[10px] text-slate-500 truncate max-w-[210px]">Für: ${item.sources.join(', ')}</div>
                                      </div>
                                    </div>
                                    <span className=${`text-xs font-extrabold whitespace-nowrap ${isChecked ? 'line-through text-slate-600' : 'text-emerald-400'}`}>
                                      ${item.amount} ${item.unit}
                                    </span>
                                  </div>
                                `;
                              })}
                            </div>
                          </div>
                        `;
                      })}
                    </div>
                  `}
                `}
              </main>
            ` : ''}
          </div>
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
