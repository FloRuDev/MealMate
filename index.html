    // ============================================================================
    // REINE DOMÄNEN-FUNKTIONEN
    // ============================================================================
    const getRandomSubset = (array, size = APP_CONFIG.INITIAL_DECK_SIZE, rng = Math.random) => {
      if (!Array.isArray(array) || array.length === 0 || size <= 0) return [];
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, Math.min(size, copy.length));
    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const getDayPortions = (item) => {
      if (!item) return {};
      if (item.dayPortions && typeof item.dayPortions === 'object') return item.dayPortions;
      if (item.weekday) return { [item.weekday]: item.portions || APP_CONFIG.DEFAULT_BASE_PORTIONS };
      return {};
    };

    const getTotalPortions = (item) => {
      if (!item) return APP_CONFIG.DEFAULT_BASE_PORTIONS;
      const dp = getDayPortions(item);
      const days = Object.keys(dp);
      if (days.length > 0) return days.reduce((sum, day) => sum + (Number(dp[day]) || 0), 0);
      return item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
    };

    const formatDaySchedule = (item) => {
      const dp = getDayPortions(item);
      return WEEKDAYS.filter((d) => (dp[d.short] || 0) > 0)
        .map((d) => `${d.short}: ${dp[d.short]}P`)
        .join(', ');
    };

    const applyWeekdayToggle = (item, dayShort, defaultPortions = APP_CONFIG.DEFAULT_DAY_PORTIONS) => {
      const currentDp = { ...getDayPortions(item) };
      if (currentDp[dayShort]) delete currentDp[dayShort];
      else currentDp[dayShort] = defaultPortions;
      
      const remainingDays = WEEKDAYS.map((d) => d.short).filter((d) => currentDp[d] > 0);
      const nextTotal = remainingDays.length > 0 ? remainingDays.reduce((sum, d) => sum + currentDp[d], 0) : item.portions || item.recipe?.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
      return { ...item, dayPortions: currentDp, portions: nextTotal, weekday: remainingDays[0] || null };
    };

    const applyDayPortionDelta = (item, dayShort, delta) => {
      const currentDp = { ...getDayPortions(item) };
      const currentVal = currentDp[dayShort] || APP_CONFIG.DEFAULT_DAY_PORTIONS;
      currentDp[dayShort] = clamp(currentVal + delta, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_DAY_PORTIONS);
      const nextTotal = Object.values(currentDp).reduce((sum, v) => sum + v, 0);
      return { ...item, dayPortions: currentDp, portions: nextTotal };
    };

    const CATEGORY_ORDER = [
      { key: 'Obst & Gemüse', icon: '🥦', badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' },
      { key: 'Fleisch & Frische', icon: '🍗', badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30' },
      { key: 'Kühlregal', icon: '🥛', badge: 'bg-sky-500/15 text-sky-300 border-sky-500/30' },
      { key: 'Tiefkühlung', icon: '❄️', badge: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
      { key: 'Vorratsschrank', icon: '🥫', badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30' }
    ];

    const aggregateShoppingList = (activeShoppingRecipes) => {
      const map = {};
      const validCategories = new Set(CATEGORY_ORDER.map((c) => c.key));
      (activeShoppingRecipes || []).forEach((item) => {
        const { recipe } = item;
        if (!recipe || !Array.isArray(recipe.ingredients)) return;
        const totalPortions = getTotalPortions(item);
        const scheduleLabel = formatDaySchedule(item);
        const basePortions = recipe.basePortions || APP_CONFIG.DEFAULT_BASE_PORTIONS;
        const scale = totalPortions / basePortions;

        recipe.ingredients.forEach((ing) => {
          const normCategory = validCategories.has(ing.category) ? ing.category : 'Vorratsschrank';
          const key = `${normCategory}__${ing.name.toLowerCase().trim()}__${ing.unit.toLowerCase().trim()}`;
          if (!map[key]) map[key] = { id: key, name: ing.name, unit: ing.unit, category: normCategory, amount: 0, sources: [] };
          map[key].amount += ing.amount * scale;
          const sourceLabel = scheduleLabel ? `${recipe.title} (${scheduleLabel})` : `${recipe.title} (${totalPortions}P)`;
          if (!map[key].sources.includes(sourceLabel)) map[key].sources.push(sourceLabel);
        });
      });
      const grouped = {};
      CATEGORY_ORDER.forEach((cat) => { grouped[cat.key] = []; });
      Object.values(map).forEach((entry) => {
        const roundedAmount = entry.amount >= 10 ? Math.round(entry.amount) : Math.round(entry.amount * 10) / 10;
        grouped[entry.category].push({ ...entry, amount: roundedAmount });
      });
      return grouped;
    };

    const calculatePlanStats = (activeShoppingRecipes, savedRecipes) => {
      const targetList = activeShoppingRecipes && activeShoppingRecipes.length > 0 ? activeShoppingRecipes : savedRecipes || [];
      if (targetList.length === 0) return { totalPortions: 0, avgCalories: 0, avgProtein: 0 };
      let totalPortions = 0, weightedCal = 0, weightedProt = 0;
      targetList.forEach((item) => {
        const portions = getTotalPortions(item);
        totalPortions += portions;
        weightedCal += (item.recipe?.calories || 0) * portions;
        weightedProt += (item.recipe?.protein || 0) * portions;
      });
      return { totalPortions, avgCalories: totalPortions > 0 ? Math.round(weightedCal / totalPortions) : 0, avgProtein: totalPortions > 0 ? Math.round(weightedProt / totalPortions) : 0 };
    };

    const formatShoppingListText = (activeShoppingRecipes = [], aggregatedShoppingList = {}, checkedItems = {}) => {
      const lines = ['🛒 MEALMATE EINKAUFSLISTE', ''];
      if (activeShoppingRecipes.length > 0) {
        lines.push('Geplante Gerichte:');
        activeShoppingRecipes.forEach((item) => {
          const schedule = formatDaySchedule(item);
          lines.push(`- ${item.recipe?.title}: ${getTotalPortions(item)} Portionen${schedule ? ` (${schedule})` : ''}`);
        });
        lines.push('');
      }
      CATEGORY_ORDER.forEach(({ key, icon }) => {
        const items = aggregatedShoppingList[key] || [];
        if (items.length === 0) return;
        lines.push(`${icon} ${key.toUpperCase()}`);
        items.forEach((item) => { lines.push(`${checkedItems[item.id] ? '[x]' : '[ ]'} ${item.amount} ${item.unit} ${item.name}`); });
        lines.push('');
      });
      return lines.join('\n').trim();
    };

    const collectKnownRecipeTitles = (deck = [], savedRecipes = [], database = []) => {
      const titles = new Set();
      (database || []).forEach((r) => r?.title && titles.add(r.title.trim()));
      (deck || []).forEach((r) => r?.title && titles.add(r.title.trim()));
      (savedRecipes || []).forEach((item) => item?.recipe?.title && titles.add(item.recipe.title.trim()));
      return Array.from(titles);
    };

    const coercePositiveNumber = (val, fallback, min = 0, max = 10000) => {
      const num = typeof val === 'number' ? val : Number(String(val ?? '').replace(',', '.'));
      if (!Number.isFinite(num)) return fallback;
      return clamp(num, min, max);
    };

    const coerceNonEmptyString = (val, fallback) => {
      if (typeof val === 'string' && val.trim().length > 0) return val.trim();
      return fallback;
    };

    const validateAndSanitizeRecipe = (raw, fallbackIdPrefix = 'rec-validated', index = 0) => {
      if (!raw || typeof raw !== 'object') return { valid: false, recipe: null };
      const title = coerceNonEmptyString(raw.title, '');
      if (!title) return { valid: false, recipe: null };
      
      const rawIngredients = Array.isArray(raw.ingredients) ? raw.ingredients : [];
      const sanitizedIngredients = rawIngredients.length > 0 ? rawIngredients.map((ing, idx) => ({
        name: coerceNonEmptyString(ing.name, `Zutat ${idx + 1}`),
        amount: coercePositiveNumber(ing.amount, 100, 0.1, 5000),
        unit: coerceNonEmptyString(ing.unit, 'g'),
        category: CATEGORY_ORDER.some(c => c.key === ing.category) ? ing.category : 'Vorratsschrank'
      })) : [{ name: 'Hauptzutat', amount: 400, unit: 'g', category: 'Fleisch & Frische' }];

      const rawSteps = Array.isArray(raw.steps) ? raw.steps.map((s) => coerceNonEmptyString(s, '')).filter(Boolean) : [];
      
      return {
        valid: true,
        recipe: {
          id: coerceNonEmptyString(raw.id, `${fallbackIdPrefix}-${Date.now()}-${index}`),
          title,
          subtitle: coerceNonEmptyString(raw.subtitle, 'Leckeres Familien-Rezept'),
          emoji: coerceNonEmptyString(raw.emoji, '🍲'),
          accentColor: coerceNonEmptyString(raw.accentColor, ACCENT_GRADIENTS[index % ACCENT_GRADIENTS.length]),
          prepTimeActive: Math.round(coercePositiveNumber(raw.prepTimeActive, 15, 5, 120)),
          prepTimePassive: Math.round(coercePositiveNumber(raw.prepTimePassive, 20, 0, 240)),
          effortLevel: coerceNonEmptyString(raw.effortLevel, 'Gering'),
          fridgeDays: Math.round(coercePositiveNumber(raw.fridgeDays, 3, 1, 7)),
          freezerMonths: Math.round(coercePositiveNumber(raw.freezerMonths, 2, 0, 12)),
          toddlerNote: coerceNonEmptyString(raw.toddlerNote, 'Mild gewürzt'),
          calories: Math.round(coercePositiveNumber(raw.calories, 500, 150, 1500)),
          protein: Math.round(coercePositiveNumber(raw.protein, 40, 5, 150)),
          carbs: Math.round(coercePositiveNumber(raw.carbs, 50, 0, 250)),
          fat: Math.round(coercePositiveNumber(raw.fat, 12, 1, 100)),
          basePortions: Math.round(coercePositiveNumber(raw.basePortions, APP_CONFIG.DEFAULT_BASE_PORTIONS, 1, 12)),
          ingredients: sanitizedIngredients,
          steps: rawSteps.length > 0 ? rawSteps : ['Zutaten vorbereiten und kochen.']
        }
      };
    };

    const enrichAiRecipeBatch = (rawRecipes, existingTitles = [], timestamp = Date.now()) => {
      if (!Array.isArray(rawRecipes)) return [];
      const seen = new Set(existingTitles.map((t) => t.toLowerCase().trim()));
      const result = [];
      rawRecipes.forEach((raw, idx) => {
        const validation = validateAndSanitizeRecipe(raw, `ai-batch-${timestamp}`, idx);
        if (!validation.valid || !validation.recipe) return;
        const normTitle = validation.recipe.title.toLowerCase().trim();
        if (seen.has(normTitle)) return;
        seen.add(normTitle);
        result.push(validation.recipe);
      });
      return result;
    };

    const mergeRecipesIntoDatabase = (currentDatabase = [], incomingRecipes = []) => {
      const updatedDb = [...currentDatabase];
      const seenIds = new Set(updatedDb.map((r) => r?.id).filter(Boolean));
      (incomingRecipes || []).forEach((recipe, idx) => {
        if (!recipe || !recipe.title) return;
        const ensuredId = recipe.id || `db-rec-${Date.now()}-${idx}`;
        if (!seenIds.has(ensuredId)) {
          seenIds.add(ensuredId);
          updatedDb.push(recipe);
        }
      });
      return updatedDb;
    };

    const drawRotationDeck = (database = [], size = APP_CONFIG.INITIAL_DECK_SIZE, rng = Math.random) =>
      getRandomSubset(database, size, rng);

    // ============================================================================
    // OFFLINE CACHE (INDEXED DB)
    // ============================================================================
    const OfflineCacheEngine = (() => {
      const memoryFallback = {};
      const openDb = () => new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB nicht verfügbar')); return; }
        const req = window.indexedDB.open(APP_CONFIG.IDB_NAME, APP_CONFIG.IDB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains('kvStore')) e.target.result.createObjectStore('kvStore');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      const getSyncItem = (key, defaultVal) => {
        try { const raw = window.localStorage.getItem(`mealmate_${key}`); if (raw) return JSON.parse(raw); } catch {}
        return memoryFallback[key] ?? defaultVal;
      };

      const getItem = async (key, defaultVal) => {
        const syncVal = getSyncItem(key, undefined);
        if (syncVal !== undefined) return syncVal;
        try {
          const idb = await openDb();
          const val = await new Promise((resolve) => {
            const req = idb.transaction('kvStore', 'readonly').objectStore('kvStore').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(undefined);
          });
          if (val !== undefined) return val;
        } catch {}
        return defaultVal;
      };

      const setItem = async (key, value) => {
        memoryFallback[key] = value;
        try { window.localStorage.setItem(`mealmate_${key}`, JSON.stringify(value)); } catch {}
        try {
          const idb = await openDb();
          await new Promise((resolve) => {
            const tx = idb.transaction('kvStore', 'readwrite');
            tx.objectStore('kvStore').put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch {}
      };
      return { getSyncItem, getItem, setItem };
    })();

    // ============================================================================
    // API CALLS (BFF GATEWAY SIMULATION)
    // ============================================================================
    async function callGeminiRecipeBatchAgent(count, excludedTitles, userApiKey) {
      if (!userApiKey) throw new Error('Kein API Key');
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userApiKey.trim())}`;
      const systemPrompt = `Du bist ein KI-Kochassistent. Erstelle ${count} Familien-Meal-Prep-Rezepte. Format JSON. ${excludedTitles.length > 0 ? `Vermeide: ${excludedTitles.join(', ')}.` : ''}`;

      const payload = {
        contents: [{ parts: [{ text: `Generiere ${count} Rezeptkarten.` }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'OBJECT', properties: { recipes: { type: 'ARRAY', items: { type: 'OBJECT', properties: { title: { type: 'STRING' }, subtitle: { type: 'STRING' }, emoji: { type: 'STRING' }, prepTimeActive: { type: 'INTEGER' }, prepTimePassive: { type: 'INTEGER' }, effortLevel: { type: 'STRING' }, fridgeDays: { type: 'INTEGER' }, freezerMonths: { type: 'INTEGER' }, toddlerNote: { type: 'STRING' }, calories: { type: 'INTEGER' }, protein: { type: 'INTEGER' }, carbs: { type: 'INTEGER' }, fat: { type: 'INTEGER' }, ingredients: { type: 'ARRAY', items: { type: 'OBJECT', properties: { name: { type: 'STRING' }, amount: { type: 'NUMBER' }, unit: { type: 'STRING' }, category: { type: 'STRING' } } } }, steps: { type: 'ARRAY', items: { type: 'STRING' } } } } } } } }
      };

      const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      return enrichAiRecipeBatch(JSON.parse(result?.candidates?.[0]?.content?.parts?.[0]?.text)?.recipes || [], excludedTitles);
    }

    async function callGeminiRecipeAgent(userInstruction, currentRecipeContext, userApiKey) {
      if (!userApiKey) throw new Error('Kein API Key');
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userApiKey.trim())}`;
      const promptText = currentRecipeContext ? `Wandle ab: "${userInstruction}". Rezept: ${JSON.stringify(currentRecipeContext)}.` : `Erstelle neues Rezept: "${userInstruction}".`;
      
      const payload = { contents: [{ parts: [{ text: promptText }] }], generationConfig: { responseMimeType: 'application/json' } };
      const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { valid, recipe } = validateAndSanitizeRecipe(JSON.parse((await response.json())?.candidates?.[0]?.content?.parts?.[0]?.text), 'ai-single');
      if (!valid) throw new Error('Formatfehler');
      return recipe;
    }

                      <div className="flex items-center gap-1 px-3.5 pt-2.5 bg-slate-900 no-drag">
                        <button onClick=${() => setCardTab('ingredients')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${cardTab === 'ingredients' ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>📋 Zutaten</button>
                        <button onClick=${() => setCardTab('steps')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition ${cardTab === 'steps' ? 'bg-slate-800 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>👨‍🍳 Ablauf</button>
                        <button onClick=${() => setCardTab('ai')} className=${`flex-1 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${cardTab === 'ai' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'text-slate-400'}`}><${Icons.Wand2} className="w-3 h-3" /> KI-Umbau</button>
                      </div>

                      <div className="flex-1 overflow-y-auto px-3.5 py-2.5 space-y-2 no-drag max-h-[250px] ios-scroll">
                        ${cardTab === 'ingredients' ? html`
                          <ul className="space-y-1.5">
                            ${currentCard.ingredients.map((ing, idx) => html`<li key=${idx} className="flex items-center justify-between text-xs bg-slate-950/70 border border-slate-800/80 px-3 py-1.5 rounded-xl"><span className="text-slate-200 font-medium">${ing.name}</span><span className="text-emerald-400 font-bold ml-2">${ing.amount} ${ing.unit}</span></li>`)}
                          </ul>
                        ` : ''}
                        ${cardTab === 'steps' ? html`
                          <div className="space-y-2">
                            ${currentCard.steps.map((step, i) => html`<div key=${i} className="flex items-start gap-2.5 bg-slate-950/70 border border-slate-800/80 p-2.5 rounded-xl text-xs text-slate-200"><span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span><p>${step}</p></div>`)}
                          </div>
                        ` : ''}
                        ${cardTab === 'ai' ? html`
                          <div className="space-y-2.5 py-1">
                            <p className="text-xs text-slate-300">Rezept abwandeln (erfordert gespeicherten API-Key):</p>
                            <div className="flex flex-wrap gap-1.5">
                              ${['Mit Reis statt Kartoffeln', 'Vegetarisch (Hüttenkäse/Quark)', 'Noch weniger Aufwand (TK)'].map((chip) => html`<button key=${chip} disabled=${isGenerating || !userApiKey} onClick=${() => handleModifyCurrentRecipe(chip)} className="text-[11px] px-2.5 py-1.5 rounded-xl bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 font-medium disabled:opacity-50">✨ ${chip}</button>`)}
                            </div>
                          </div>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                  <div className="pt-3 flex items-center justify-center gap-5">
                    <button onClick=${() => triggerDecision('nope')} disabled=${isGenerating} className="w-14 h-14 rounded-full bg-slate-900 border-2 border-slate-700 text-slate-400 flex items-center justify-center active:scale-90 transition"><${Icons.X} className="w-7 h-7 stroke-[2.5]" /></button>
                    <button onClick=${() => triggerDecision('like')} disabled=${isGenerating} className="w-14 h-14 rounded-full bg-gradient-to-br from-orange-400 to-rose-500 text-white flex items-center justify-center active:scale-90 transition"><${Icons.Heart} className="w-7 h-7 fill-white stroke-[2]" /></button>
                  </div>
                ` : html`
                  <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-4">
                    ${isGenerating ? html`<${Icons.RefreshCw} className="w-8 h-8 text-cyan-400 animate-spin" />` : html`
                      <div className="w-16 h-16 rounded-3xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-3xl">✨</div>
                      <h2 className="text-lg font-extrabold text-white">Runde durchgeswiped!</h2>
                      <div className="w-full space-y-2">
                        <button disabled=${isGenerating} onClick=${() => { setDeck(drawRotationDeck(recipeDatabase)); setCurrentIndex(0); setCardTab('ingredients'); }} className="w-full py-3 rounded-2xl bg-slate-800 text-cyan-300 font-extrabold text-xs flex items-center justify-center gap-2"><${Icons.Shuffle} className="w-4 h-4" />6 zufällige Rezepte aus DB ziehen</button>
                        <button disabled=${isGenerating || !userApiKey} onClick=${() => handleGenerateBatchCards(recipeDatabase)} className="w-full py-3 rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-2 disabled:opacity-50"><${Icons.Sparkles} className="w-4 h-4" />KI-Rezepte generieren</button>
                      </div>
                    `}
                  </div>
                `}
              </main>
            ` : ''}

            ${activeView === 'saved' ? html`
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                  <div className="flex items-center justify-between">
                    <div><h2 className="text-sm font-extrabold text-white flex items-center gap-1.5"><${Icons.Bookmark} className="w-4 h-4 text-emerald-400" /><span>Geparkte Rezepte</span></h2></div>
                    <span className="px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-400 text-xs font-extrabold border border-emerald-500/30">${activeShoppingRecipes.length} / ${savedRecipes.length} aktiv</span>
                  </div>
                  ${savedRecipes.length > 0 ? html`
                    <div className="pt-2 border-t border-slate-800/80">
                      <div className="grid grid-cols-7 gap-1">
                        ${WEEKDAYS.map((day) => {
                          const sum = savedRecipes.reduce((s, r) => s + (getDayPortions(r)[day.short] || 0), 0);
                          const isSelected = weekdayFilter === day.short;
                          return html`<button key=${day.short} onClick=${() => setWeekdayFilter(weekdayFilter === day.short ? 'Alle' : day.short)} className=${`py-1.5 rounded-xl border text-center flex flex-col items-center justify-center ${isSelected ? 'bg-emerald-500 text-slate-950 border-emerald-400 font-extrabold' : sum > 0 ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}`}><span className="text-[11px]">${day.short}</span><span className=${`text-[9px] mt-0.5 ${isSelected ? 'text-slate-950' : sum > 0 ? 'text-emerald-400' : 'text-slate-600'}`}>${sum > 0 ? `${sum}P` : '–'}</span></button>`;
                        })}
                      </div>
                    </div>
                  ` : ''}
                </div>

                ${savedRecipes.length === 0 ? html`
                  <div className="flex-1 flex flex-col items-center justify-center text-center py-12 px-4"><${Icons.ChefHat} className="w-12 h-12 text-slate-600 mb-3" /><p className="text-sm font-bold text-slate-300">Noch keine Rezepte gemerkt</p></div>
                ` : html`
                  <div className="space-y-3 pb-4">
                    ${savedRecipes.filter((item) => weekdayFilter === 'Alle' || (getDayPortions(item)[weekdayFilter] || 0) > 0).map((item) => {
                      const { recipe, inShoppingList } = item;
                      const dayPortions = getDayPortions(item);
                      const activeDays = WEEKDAYS.filter((d) => dayPortions[d.short] > 0);
                      const totalPortions = getTotalPortions(item);
                      const isPromptOpen = portionPromptRecipeId === recipe.id;

                      return html`
                        <div key=${recipe.id} className=${`bg-slate-950/90 border rounded-2xl p-3.5 space-y-3 ${inShoppingList ? 'border-emerald-500/60' : 'border-slate-800'}`}>
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-2.5"><span className="text-2xl">${recipe.emoji}</span><div><h3 className="text-xs font-extrabold text-white">${recipe.title}</h3></div></div>
                            <button onClick=${() => updateSavedRecipesWithPersistence((prev) => prev.filter((i) => i.recipe.id !== recipe.id))} className="p-1.5 rounded-xl text-slate-500 hover:text-rose-400"><${Icons.Trash2} className="w-4 h-4" /></button>
                          </div>
                          
                          <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800/90 space-y-2">
                            <div className="grid grid-cols-7 gap-1">
                              ${WEEKDAYS.map((day) => {
                                const count = dayPortions[day.short] || 0;
                                const active = count > 0;
                                return html`<button key=${day.short} onClick=${() => updateSavedRecipesWithPersistence(prev => prev.map(e => e.recipe.id === recipe.id ? applyWeekdayToggle(e, day.short) : e))} className=${`py-1.5 rounded-lg text-[11px] font-bold flex flex-col items-center ${active ? 'bg-indigo-500 text-white' : 'bg-slate-950 text-slate-400'}`}><span>${day.short}</span>${active ? html`<span className="text-[9px] mt-0.5">${count}P</span>` : ''}</button>`;
                              })}
                            </div>
                            ${activeDays.length > 0 ? html`
                              <div className="pt-1.5 border-t border-slate-800/80 space-y-1.5">
                                ${activeDays.map((day) => html`
                                  <div key=${day.short} className="flex items-center justify-between bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800/90">
                                    <span className="text-xs font-bold text-slate-200">${day.full}</span>
                                    <div className="flex items-center gap-2">
                                      <button onClick=${() => updateSavedRecipesWithPersistence(prev => prev.map(e => e.recipe.id === recipe.id ? applyDayPortionDelta(e, day.short, -1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Minus} className="w-3 h-3" /></button>
                                      <span className="text-xs font-black text-cyan-400 w-14 text-center">${dayPortions[day.short]} Port.</span>
                                      <button onClick=${() => updateSavedRecipesWithPersistence(prev => prev.map(e => e.recipe.id === recipe.id ? applyDayPortionDelta(e, day.short, 1) : e))} className="w-6 h-6 rounded-md bg-slate-800 text-white flex items-center justify-center"><${Icons.Plus} className="w-3 h-3" /></button>
                                    </div>
                                  </div>
                                `)}
                              </div>
                            ` : ''}
                          </div>
                          
                          ${(!inShoppingList && !isPromptOpen) ? html`<button onClick=${() => handleToggleShoppingListClick(item)} className="w-full py-2.5 px-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-xs font-bold flex items-center justify-between"><span className="flex items-center gap-2"><${Icons.ShoppingBag} className="w-3.5 h-3.5 text-emerald-400" /><span>Zur Einkaufsliste...</span></span><span className="text-[11px] px-2 py-0.5 rounded-lg bg-slate-800 text-slate-400">${activeDays.length > 0 ? formatDaySchedule(item) : 'Portionen wählen'}</span></button>` : ''}
                          
                          ${isPromptOpen ? html`
                            <div className="bg-emerald-950/30 border border-emerald-500/50 rounded-xl p-3 space-y-2.5">
                              <div className="flex items-center justify-between"><span className="text-xs font-extrabold text-emerald-300">Portionen einkaufen?</span><button onClick=${() => setPortionPromptRecipeId(null)} className="text-slate-400"><${Icons.X} className="w-3.5 h-3.5" /></button></div>
                              <div className="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-xl border border-slate-800">
                                <span className="text-xs text-slate-300 font-semibold">Portionen:</span>
                                <div className="flex items-center gap-3">
                                  <button onClick=${() => setPromptPortions((p) => clamp(p - 1, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_TOTAL_PORTIONS))} className="w-7 h-7 rounded-lg bg-slate-800 text-white flex items-center justify-center"><${Icons.Minus} className="w-3.5 h-3.5" /></button>
                                  <span className="text-sm font-black text-emerald-400 w-14 text-center">${promptPortions} Port.</span>
                                  <button onClick=${() => setPromptPortions((p) => clamp(p + 1, APP_CONFIG.MIN_PORTIONS, APP_CONFIG.MAX_TOTAL_PORTIONS))} className="w-7 h-7 rounded-lg bg-slate-800 text-white flex items-center justify-center"><${Icons.Plus} className="w-3.5 h-3.5" /></button>
                                </div>
                              </div>
                              <button onClick=${() => { updateSavedRecipesWithPersistence(prev => prev.map(e => e.recipe.id === recipe.id ? { ...e, inShoppingList: true, portions: promptPortions } : e)); setPortionPromptRecipeId(null); }} className="w-full py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-1.5"><${Icons.Check} className="w-4 h-4 stroke-[2.5]" /><span>Mit ${promptPortions} Portionen auf Einkaufsliste</span></button>
                            </div>
                          ` : ''}

                          ${(inShoppingList && !isPromptOpen) ? html`
                            <div className="flex items-center justify-between bg-emerald-500/10 px-3 py-2 rounded-xl border border-emerald-500/30">
                              <button onClick=${() => handleToggleShoppingListClick(item)} className="flex items-center gap-2 text-left"><div className="w-4 h-4 rounded-md bg-emerald-500 text-slate-950 flex items-center justify-center"><${Icons.Check} className="w-3 h-3 stroke-[3]" /></div><div><span className="text-xs font-extrabold text-emerald-300 block">Auf der Einkaufsliste</span></div></button>
                              <span className="text-xs font-black text-emerald-400 bg-slate-900/90 px-2.5 py-1 rounded-lg border border-emerald-500/30">∑ ${totalPortions} Port.</span>
                            </div>
                          ` : ''}
                        </div>
                      `;
                    })}
                  </div>
                `}
              </main>
            ` : ''}

            ${activeView === 'shopping' ? html`
              <main className="flex-1 flex flex-col p-4 overflow-y-auto ios-scroll space-y-4">
                <div className="flex items-center justify-between bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5">
                  <div><h2 className="text-sm font-extrabold text-white">Smarte Einkaufsliste</h2><p className="text-[11px] text-slate-400">Summiert für ${totalPlanStats.totalPortions} Portionen</p></div>
                  ${activeShoppingRecipes.length > 0 ? html`<button onClick=${handleCopyShoppingList} className="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md"><${Icons.Copy} className="w-3.5 h-3.5" /><span>Kopieren</span></button>` : ''}
                </div>

                ${activeShoppingRecipes.length === 0 ? html`
                  <div className="flex-1 flex flex-col items-center justify-center text-center py-12 px-4"><${Icons.ShoppingBag} className="w-12 h-12 text-slate-600 mb-3" /><p className="text-sm font-bold text-slate-300">Noch keine Rezepte auf der Einkaufsliste</p></div>
                ` : html`
                  <div className="space-y-4 pb-4">
                    ${CATEGORY_ORDER.map(({ key, icon, badge }) => {
                      const items = aggregatedShoppingList[key] || [];
                      if (items.length === 0) return null;
                      return html`
                        <div key=${key} className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
                          <div className="flex items-center justify-between"><span className=${`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border ${badge}`}><span>${icon}</span><span>${key}</span></span></div>
                          <div className="divide-y divide-slate-800/60">
                            ${items.map((item) => {
                              const isChecked = !!checkedItems[item.id];
                              return html`
                                <div key=${item.id} onClick=${() => { setCheckedItems(prev => { const n = {...prev, [item.id]: !prev[item.id]}; OfflineCacheEngine.setItem('checkedItems', n); return n; }); }} className="py-2 flex items-center justify-between gap-2 cursor-pointer">
                                  <div className="flex items-center gap-2.5"><div className=${`w-4 h-4 rounded-md border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>${isChecked ? html`<${Icons.Check} className="w-3 h-3 stroke-[3]" />` : ''}</div><div><div className=${`text-xs font-medium ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}`}>${item.name}</div><div className="text-[10px] text-slate-500 truncate max-w-[210px]">Für: ${item.sources.join(', ')}</div></div></div>
                                  <span className=${`text-xs font-extrabold whitespace-nowrap ${isChecked ? 'line-through text-slate-600' : 'text-emerald-400'}`}>${item.amount} ${item.unit}</span>
                                </div>
                              `;
                            })}
                          </div>
                        </div>
                      `;
                    })}
                  </div>
                `}
              </main>
            ` : ''}
          </div>
        </div>
      `;
    }

    // React in den DOM einhängen
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
